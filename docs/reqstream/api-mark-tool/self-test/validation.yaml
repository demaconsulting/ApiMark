---
# Validation unit requirements
sections:
  - title: ApiMarkTool Requirements
    sections:
      - title: SelfTest Requirements
        sections:
          - title: Validation Requirements
            requirements:
              - id: ApiMarkTool-SelfTest-Validation-RunVersionDisplayTest
                title: Validation shall invoke apimark --version and verify output
                  contains the version string.
                justification: |
                  Version display is the simplest observable behavior of the tool and confirms
                  that the executable is intact and able to run its own dispatch path.
                tests:
                  - Validation_Run_WritesVersionAndHelpTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-RunHelpDisplayTest
                title: Validation shall invoke apimark --help and verify output contains
                  "Usage:" and "Options:".
                justification: |
                  Help display exercises a larger fraction of the dispatch path than --version
                  and confirms that the tool's usage information is intact and readable.
                tests:
                  - Validation_Run_WritesVersionAndHelpTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-WriteResultsFileOnRequest
                title: Validation shall write test results to the file specified by
                  --results when the extension is .trx or .xml.
                justification: |
                  CI systems need machine-readable test results for automated pass/fail
                  reporting and traceability; .trx is the native Visual Studio format and
                  .xml (JUnit) is supported by most CI platforms.
                tests:
                  - Validation_Run_WithResultsTrxFile_CreatesTrxFile
                  - Validation_Run_WithResultsXmlFile_CreatesXmlFile
              - id: ApiMarkTool-SelfTest-Validation-SetExitCodeOnFailure
                title: Validation shall set ExitCode to 1 when any self-test fails.
                justification: |
                  Callers must detect validation failures through the standard exit-code
                  mechanism; routing all failures through WriteError ensures that both
                  console and log-file consumers see the diagnostic and that the exit
                  code reflects the failure.
                tests: [Validation_Run_WithUnsupportedResultsExtension_SetsExitCodeToOne]
              - id: ApiMarkTool-SelfTest-Validation-RejectUnsupportedExtension
                title: Validation shall set ExitCode to 1 and write a diagnostic message
                  when the results file extension is not .trx or .xml.
                justification: |
                  An unsupported file extension indicates a misconfigured caller; rejecting
                  it with a non-zero exit code and a clear message lets the caller detect
                  and correct the configuration error without inspecting partial output.
                tests: [Validation_Run_WithUnsupportedResultsExtension_SetsExitCodeToOne]
              - id: ApiMarkTool-SelfTest-Validation-RunDotNetGenerationTest
                title: Validation shall run the real DotNetGenerator Parse/Emit pipeline
                  against a sample assembly and verify the generated Markdown contains
                  expected content.
                justification: |
                  Exercising the actual generator end to end (rather than just the CLI
                  dispatch path) confirms the DotNet documentation generation feature is
                  functional in the deployed tool binary, not merely that the process runs.
                tests:
                  - Validation_Run_WritesFunctionalGenerationTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-RunCppGenerationTest
                title: Validation shall run the real CppGenerator Parse/Emit pipeline
                  against a tiny embedded sample header and verify the generated Markdown
                  contains expected content, when clang is available.
                justification: |
                  Exercising the actual C++ generator end to end confirms the C++
                  documentation generation feature is functional in the deployed tool
                  binary whenever a clang toolchain is present.
                tests:
                  - Validation_Run_WritesFunctionalGenerationTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-RunVhdlGenerationTest
                title: Validation shall run the real VhdlGenerator Parse/Emit pipeline
                  against a tiny embedded sample VHDL entity and verify the generated
                  Markdown contains expected content.
                justification: |
                  VHDL parsing has no external tool dependency, so this test can always
                  run and confirms the VHDL documentation generation feature is functional
                  in the deployed tool binary on every platform.
                tests:
                  - Validation_Run_WritesFunctionalGenerationTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-SkipCppWhenClangUnavailable
                title: Validation shall record the C++ generation and C++ enforcement
                  tests as skipped (not failed) and must not set ExitCode to a
                  non-zero value when clang cannot be located.
                justification: |
                  Requiring clang for every environment running --validate would make
                  self-validation unreliable on machines without a C++ toolchain;
                  skipping (rather than failing) the C++ tests preserves a useful,
                  non-blocking signal while still validating C++ support when possible.
                tests: [Validation_Run_CppTestsSkippedWhenClangUnavailable]
              - id: ApiMarkTool-SelfTest-Validation-ReportSkippedCount
                title: 'Validation shall print a "Skipped: N" line in its summary output reflecting the number of self-tests recorded as skipped.'
                justification: |
                  Operators and CI logs need visibility into how many self-tests were
                  skipped (as distinct from passed or failed) so that a skip is not
                  silently mistaken for either a pass or the absence of that test.
                tests: [Validation_Run_WritesSkippedSummaryLine]
              - id: ApiMarkTool-SelfTest-Validation-RunDotNetEnforceDocsTest
                title: Validation shall run the real DotNetGenerator
                  CheckDocumentationCoverage pipeline against the tool's own already-built
                  assembly and verify the checker completes with internally consistent
                  counts.
                justification: |
                  Exercising the actual documentation-coverage enforcement path end to
                  end (rather than just the CLI dispatch path) confirms the
                  --enforce-docs feature is functional for DotNet in the deployed tool
                  binary, not merely that the process runs. The tool's own assembly is
                  reused (as with RunDotNetGenerationTest) since its exact undocumented
                  count varies by build configuration and target framework.
                tests:
                  - Validation_Run_DotNetEnforceDocsTestPasses
                  - Validation_Run_WritesFunctionalGenerationTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-RunCppEnforceDocsTest
                title: Validation shall run the real CppGenerator
                  CheckDocumentationCoverage pipeline against a tiny embedded sample
                  struct with one documented and one deliberately undocumented field,
                  and verify the undocumented field is detected while the documented
                  one is not, when clang is available.
                justification: |
                  Exercising the actual documentation-coverage enforcement path end to
                  end confirms the --enforce-docs feature is functional for C++ in the
                  deployed tool binary whenever a clang toolchain is present.
                tests:
                  - Validation_Run_CppTestsSkippedWhenClangUnavailable
                  - Validation_Run_WritesFunctionalGenerationTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-RunVhdlEnforceDocsTest
                title: Validation shall run the real VhdlGenerator
                  CheckDocumentationCoverage pipeline against a sample source with one
                  documented and one deliberately undocumented declaration, and verify
                  the undocumented declaration is detected while the documented one is not.
                justification: |
                  Exercising the actual documentation-coverage enforcement path end to
                  end (rather than just the CLI dispatch path) confirms the
                  --enforce-docs feature is functional for VHDL in the deployed tool
                  binary, not merely that the process runs. VHDL is used because it
                  needs no external tool dependency, so this test can always run.
                tests:
                  - Validation_Run_VhdlEnforceDocsTestPasses
                  - Validation_Run_WritesFunctionalGenerationTestResults
                  - Validation_Run_WithValidContext_ExitsZero
              - id: ApiMarkTool-SelfTest-Validation-SuppressGeneratorOutput
                title: Validation shall route each functional generator's own
                  informational output to a silent, log-capturing child Context so it
                  does not interleave with the pass/fail transcript.
                justification: |
                  Generators emit their own progress diagnostics (e.g. "Parsing
                  assembly: ..." or "Found N types...") as part of normal operation;
                  surfacing that output directly in --validate's transcript would make
                  the pass/fail summary noisy and harder to read at a glance.
                tests:
                  - Validation_Run_WithValidContext_ExitsZero
                  - Validation_Run_WritesFunctionalGenerationTestResults

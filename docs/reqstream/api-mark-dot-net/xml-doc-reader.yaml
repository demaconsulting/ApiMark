---
# XmlDocReader unit requirements
sections:
  - title: ApiMarkDotNet Requirements
    sections:
      - title: XmlDocReader Requirements
        requirements:
          - id: ApiMarkDotNet-XmlDocReader-ProvideMemberDocumentationFromXmlFile
            title: XmlDocReader shall provide the summary, remarks, parameters, returns,
              exceptions, and example content for any member documented in a .NET
              XML documentation file, given that member's documentation identifier.
            justification: |
              Assembly documentation comes from compiler-produced XML files. Every
              per-member lookup used during emission — summary, remarks, parameters,
              returns, exceptions, and examples — must be available immediately after
              construction so DotNetEmitter can render developer-authored content for
              each type and member.
            tests:
              - XmlDocReader_Constructor_FileDoesNotExist_ThrowsFileNotFoundException
              - XmlDocReader_GetSummary_MemberPresent_ReturnsTrimmedText
              - XmlDocReader_GetSummary_WithInlineReferences_PreservesReferencedNames
              - XmlDocReader_GetSummary_MemberAbsent_ReturnsNull
              - XmlDocReader_GetRemarks_MemberPresent_ReturnsTrimmedText
              - XmlDocReader_GetExceptions_MemberWithExceptions_ReturnsCrefValues
              - XmlDocReader_GetParams_MemberWithParams_ReturnsNamesAndDescriptions
              - XmlDocReader_GetReturns_MemberWithReturns_ReturnsTrimmedText
              - XmlDocReader_GetExample_MemberWithExample_ReturnsTrimmedText
              - XmlDocReader_GetExample_WhitespaceOnly_ReturnsNull
              - XmlDocReader_GetExampleParts_NoCodeElement_ReturnsWholeTextAsCodePart
              - XmlDocReader_GetExampleParts_WithCodeElement_SeparatesProseFromCode
              - XmlDocReader_GetExampleParts_MemberAbsent_ReturnsEmpty
              - XmlDocReader_GetExceptionDetails_MemberWithExceptions_ReturnsFormattedTypesAndDescriptions
              - XmlDocReader_GetRemarks_MemberAbsent_ReturnsNull
              - XmlDocReader_GetReturns_MemberAbsent_ReturnsNull
              - XmlDocReader_GetExample_MemberAbsent_ReturnsNull
          - id: ApiMarkDotNet-XmlDocReader-RenderXmlDocLists
            title: XmlDocReader shall render `<list>` elements (bullet, number, table)
              with `<item>`/`<term>`/`<description>` as Markdown lists or tables.
            justification: |
              XML documentation authors use `<list>` elements to express bullet lists,
              numbered lists, and tables. Rendering these as their Markdown equivalents —
              dash items, ordered items, and pipe tables — preserves the authored
              structure instead of flattening it to concatenated inline text. A
              `<term>`/`<description>` pair renders as a bold term followed by an em dash
              and its description, and nested inline elements such as `<c>` continue to
              render through the shared inline-element dispatch.
            tests:
              - XmlDocReader_GetRemarks_BulletList_RendersDashItems
              - XmlDocReader_GetRemarks_NumberList_RendersOrderedItems
              - XmlDocReader_GetRemarks_TableList_RendersMarkdownTable
              - XmlDocReader_GetRemarks_ListItemWithTermAndDescription_RendersBoldTermDashDescription
              - XmlDocReader_GetRemarks_ListItemWithInlineCode_PreservesInlineRendering
              - XmlDocReader_GetRemarks_ListSurroundedByProse_KeepsBlankLineSeparation
              - XmlDocReader_GetRemarks_TableListCellWithPipe_EscapesPipe
              - XmlDocReader_GetRemarks_NestedListInsideItem_RendersInlineWithoutBrokenMarkdown
          - id: ApiMarkDotNet-XmlDocReader-InheritDoc
            title: XmlDocReader shall resolve `<inheritdoc />` references and inherit
              XML documentation from base members and interface members.
            justification: >
              C# XML documentation supports `<inheritdoc />` to inherit documentation
              from base class members or interface members. ApiMark must resolve these
              references to provide complete documentation for derived types, including
              when the base class or interface member is defined in an externally
              referenced assembly (e.g. a NuGet package), via an optional external
              member lookup fallback.
            tests:
              - XmlDocReader_GetSummary_InheritDocWithCref_ReturnsSummaryFromTarget
              - XmlDocReader_GetRemarks_InheritDocWithCref_ReturnsRemarksFromTarget
              - XmlDocReader_GetParams_InheritDocWithCref_ReturnsParamsFromTarget
              - XmlDocReader_GetReturns_InheritDocWithCref_ReturnsReturnsFromTarget
              - XmlDocReader_GetSummary_InheritDocWithCref_MissingTarget_ReturnsNull
              - XmlDocReader_GetSummary_InheritDocWithCref_CyclicReference_ReturnsNull
              - XmlDocReader_GetSummary_InheritDocWithPath_ReturnsFilteredSummary
              - XmlDocReader_GetSummary_InheritDocWithPath_NonMatchingPath_ReturnsNull
              - XmlDocReader_GetSummary_InheritDocWithCrefAndPath_ReturnsFilteredSummaryFromTarget
              - XmlDocReader_GetSummary_InheritDocBare_WithChain_ReturnsSummaryFromBase
              - XmlDocReader_GetSummary_InheritDocBare_NoChain_ReturnsNull
              - XmlDocReader_GetSummary_InheritDocBare_ChainMemberAbsent_ReturnsNull
              - XmlDocReader_GetSummary_InheritDocChained_ResolvesTransitively
              - XmlDocReader_GetExceptions_InheritDocWithCref_ReturnsExceptionsFromTarget
              - XmlDocReader_GetExceptionDetails_InheritDocWithCref_ReturnsExceptionDetailsFromTarget
              - XmlDocReader_GetExample_InheritDocWithCref_ReturnsExampleFromTarget
              - XmlDocReader_GetExampleParts_InheritDocWithCref_ReturnsExamplePartsFromTarget
              - XmlDocReader_GetSummary_InheritDocBare_MultipleChainCandidates_SecondCandidateNotBlockedByFirstsVisited
              - XmlDocReader_GetSummary_InheritDocBare_ChainCandidateExternal_ResolvesFromExternalResolver
              - XmlDocReader_GetSummary_InheritDocWithCref_ExternalTarget_ResolvesFromExternalResolver
              - XmlDocReader_GetSummary_InheritDocWithCrefAndPath_ExternalTarget_AppliesPathFilter
              - XmlDocReader_GetSummary_InheritDocBare_ExternalCandidateAlsoMissing_ReturnsNull
              - XmlDocReader_GetSummary_InheritDocChain_CrossesLocalAndExternalBoundary_CycleDetected
              - XmlDocReader_GetSummary_NoExternalResolverConfigured_LocalMiss_ReturnsNullUnchanged
              - XmlDocReader_GetSummary_LocalMemberUndocumented_ExternalLookupNotConsulted_ReturnsNull
          - id: ApiMarkDotNet-XmlDocReader-RenderSummaryListsAsMultiLineMarkdown
            title: XmlDocReader shall provide a GetSummaryMarkdown method that renders
              `<list>` elements (bullet, number, table) inside a `<summary>` as real
              multi-line Markdown — a blank line before the list, each item on its
              own line, and any trailing prose after the `</list>` as a separate
              paragraph — for use on member-detail-page bodies.
            justification: |
              GetSummary always collapsed `<summary>` text to a single line for compact
              contexts such as table cells, which destroyed list structure when a
              `<list>` appeared inside a `<summary>`. Member-detail-page bodies have
              room for full Markdown, so a dedicated GetSummaryMarkdown method reuses
              the existing list-rendering internals (already correct for `<remarks>`)
              with singleLine:false to produce properly structured output instead.
            tests:
              - XmlDocReader_GetSummaryMarkdown_MemberPresent_ReturnsTrimmedText
              - XmlDocReader_GetSummaryMarkdown_MemberAbsent_ReturnsNull
              - XmlDocReader_GetSummaryMarkdown_InheritDocWithCref_ReturnsSummaryFromTarget
              - XmlDocReader_GetSummaryMarkdown_NumberList_RendersMultiLineOrderedItems
              - XmlDocReader_GetSummaryMarkdown_BulletList_RendersMultiLineDashItems
              - XmlDocReader_GetSummaryMarkdown_TableList_RendersMultiLineTable
              - DotNetEmitterGradualDisclosure_Emit_TypeWithListSummary_RendersNumberedListInMarkdown
          - id: ApiMarkDotNet-XmlDocReader-RenderSummaryListsAsInlineMarkersWhenSingleLine
            title: XmlDocReader's GetSummary shall render a `<list>` element (bullet,
              number, or table) encountered in a `<summary>` using single-line
              numbered markers such as "(1) item one (2) item two", instead of
              concatenating the item text together with no separation, and shall
              preserve a `<listheader>` label (fully bolded, not double-wrapped)
              when present rather than silently dropping it.
            justification: |
              Table cells and other compact contexts require single-line summary text.
              Before this fix, a `<list>` inside a `<summary>` was flattened by the
              single-line normalizer with no separation between items, making the
              result unreadable. Numbered inline markers preserve a readable item
              boundary while still fitting on one line, applied consistently across
              all list type variants since none can express block structure inline.
              A `<list type="table">`'s `<listheader>` column labels were also
              initially dropped entirely in this compact form (only `<item>` elements
              were read), unlike the multi-line table path which keeps them; the
              header is now rendered first via a dedicated fully-bolded formatter so
              it is not lost, and so it is not accidentally double-wrapped in an
              additional `**...**` pair by a caller that also bolds the result.
            tests:
              - XmlDocReader_GetSummary_NumberList_RendersInlineNumberedMarkers
              - XmlDocReader_GetSummary_BulletList_RendersInlineNumberedMarkers
              - XmlDocReader_GetSummary_TableList_RendersInlineNumberedMarkers
          - id: ApiMarkDotNet-XmlDocReader-IncludeTypeNameForPropertyFieldEventCrefs
            title: XmlDocReader shall include the declaring type name (rendered as
              `Type.Member`) for `<see cref="P:...">`, `<see cref="F:...">`, and
              `<see cref="E:...">` references to another member, matching the
              existing behavior for `M:` method crefs.
            justification: |
              FormatMemberReference previously only included the declaring type name
              for method crefs (or when the type was a primitive), so a property,
              field, or event cref rendered as a bare member name with no indication
              of which type it belonged to — ambiguous whenever multiple types in
              scope share a member name. Always including the type name for P/F/E
              crefs, matching the already-correct M: behavior, removes that ambiguity
              without requiring architectural changes to link to the member's own page.
            tests:
              - XmlDocReader_GetSummary_SeeCrefToProperty_RendersTypeDotMember
              - XmlDocReader_GetSummary_SeeCrefToField_RendersTypeDotMember
              - XmlDocReader_GetSummary_SeeCrefToEvent_RendersTypeDotMember
              - XmlDocReader_GetSummary_SeeCrefToMethod_StillRendersTypeDotMember
              - XmlDocReader_GetSummary_WithInlineReferences_PreservesReferencedNames
              - DotNetGenerator_Generate_InlineReferences_PreserveSymbolNamesInMarkdown
          - id: ApiMarkDotNet-XmlDocReader-RenderBrAndCodeInRemarksAndSummary
            title: XmlDocReader shall render `<br/>` as a paragraph break and `<code>`
              as an inline code span or fenced Markdown code block — never silently
              dropping either — within `<remarks>` and `<summary>` content.
            justification: |
              A real-world consumer (DemaConsulting.Bicameral.Core, built with
              ApiMarkVisibility=All) reported that `<br/>` and `<code>` elements
              nested inside `<remarks>`/`<summary>` were silently dropped from the
              generated documentation, losing both the authored paragraph breaks and
              the code examples entirely. `<br/>` must render as a visible paragraph
              break and `<code>` must render as readable code (an inline backtick
              span when single-line, a fenced Markdown block when multi-line and the
              surrounding context supports block-level Markdown) so authored content
              is never lost.
            tests:
              - XmlDocReader_GetRemarks_BrElement_InsertsParagraphBreak
              - XmlDocReader_GetSummary_BrElement_CollapsesToSingleSpace
              - XmlDocReader_GetRemarks_SingleLineCodeElement_RendersAsInlineBacktickSpan
              - XmlDocReader_GetRemarks_MultiLineCodeElement_RendersAsFencedBlock
              - XmlDocReader_GetRemarks_MultiLineCodeElementWithInternalMultipleSpacesAndTabs_PreservesExactWhitespace
              - XmlDocReader_GetRemarks_EmptyOrWhitespaceOnlyCodeElement_EmitsNothing
              - XmlDocReader_GetSummary_MultiLineCodeElement_FlattensToInlineBacktickSpanNotFencedBlock
              - XmlDocReader_GetRemarks_CodeElementContainingBacktickRun_UsesLongerFence
              - XmlDocReader_GetRemarks_BrAndCodeFromGeneratedRegexExample_RendersAsDistinctBlocks
              - XmlDocReader_GetRemarks_NestedCodeInsideListItemDescription_RendersAsInlineSpanNotFencedBlock
              - XmlDocReader_GetExampleParts_WithMixedInlineElementsContainingMultiLineCodeOutsideCodeTag_RendersAsInlineSpan
          - id: ApiMarkDotNet-XmlDocReader-CollapseExcessBlankLineRuns
            title: XmlDocReader shall collapse runs of two or more consecutive blank
              lines produced by adjacent block-level separators (list, `<br/>`,
              fenced `<code>`) down to a single blank line in `<remarks>`/`<summary>`
              output.
            justification: |
              Each block-level separator (a `<list>`, a `<br/>`, a fenced `<code>`
              block) independently surrounds itself with a blank line so it renders
              correctly in isolation; when two such separators are adjacent, their
              blank lines compounded into a run of two or more, violating markdownlint
              MD012 ("no multiple consecutive blank lines") in the generated
              documentation. Collapsing any run of two or more consecutive blank lines
              down to exactly one keeps the output both readable and markdownlint-clean
              regardless of which separators happen to be adjacent.
            tests:
              - XmlDocReader_GetRemarks_ListImmediatelyFollowedByCode_AtMostOneBlankLineBetween
              - XmlDocReader_GetRemarks_MultipleConsecutiveBrTags_AtMostOneBlankLineBetween
              - XmlDocReader_GetRemarks_BrAndCodeFromGeneratedRegexExample_RendersAsDistinctBlocks
          - id: ApiMarkDotNet-XmlDocReader-WrapMemberCrefDisplayInCodeSpan
            title: XmlDocReader shall render the display text of a `<see>`/`<seealso>`
              reference to a type member (property, field, event, or method) in an
              inline Markdown code span, while leaving `langword`, explicit inner
              text, type-only (`T:`) crefs, and constructor crefs unwrapped.
            justification: |
              A real-world consumer (DemaConsulting.Bicameral.Core) reported that a
              `<see cref="Type.Member"/>` reference rendered as plain prose
              indistinguishable from surrounding text, making it hard for a reader to
              tell that `Type.Member` was a reference to a specific symbol rather than
              ordinary words. Wrapping a member-cref's rendered `Type.Member` text in
              an inline code span — matching how `<c>` content is already rendered —
              makes the reference visually distinct, without requiring the
              architectural change needed to turn it into an actual cross-reference
              link.
            tests:
              - XmlDocReader_GetSummary_SeeCrefToProperty_RendersTypeDotMember
              - XmlDocReader_GetSummary_SeeCrefToField_RendersTypeDotMember
              - XmlDocReader_GetSummary_SeeCrefToEvent_RendersTypeDotMember
              - XmlDocReader_GetSummary_SeeCrefToMethod_StillRendersTypeDotMember
              - XmlDocReader_GetSummary_WithInlineReferences_PreservesReferencedNames
              - XmlDocReader_GetExampleParts_WithSeeCref_RendersInlineReferenceInProsePart
              - XmlDocReader_GetExampleParts_WithMixedInlineElements_ProseAccumulatedAsOnePart
              - DotNetGenerator_Generate_InlineReferences_PreserveSymbolNamesInMarkdown

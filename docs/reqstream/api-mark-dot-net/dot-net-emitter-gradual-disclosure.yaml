---
# DotNetEmitterGradualDisclosure unit requirements
sections:
  - title: ApiMarkDotNet Requirements
    sections:
      - title: DotNetEmitterGradualDisclosure Requirements
        requirements:
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitApiIndexPage
            title: DotNetEmitterGradualDisclosure shall emit an api.md index page
              listing all namespaces with type counts.
            justification: |
              The api.md entrypoint gives AI agents and human readers a complete navigation
              map in a single read. Listing all namespaces with type counts provides scope
              signal without requiring further page traversal.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesApiIndexPage
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_ApiIndexContainsAssemblyNameHeading
              - DotNetGenerator_OutputFiles_FollowNamingConvention
              - DotNetGenerator_Generate_ApiMd_ListsAllNamespacesWithTypeCount
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitAssemblyDescription
            title: DotNetEmitterGradualDisclosure shall emit a paragraph following the
              assembly-level heading on the api.md index page containing an
              explicitly-supplied LibraryDescription option when present, falling back
              to the compiled AssemblyDescriptionAttribute value when LibraryDescription
              is null, empty, or consists only of whitespace.
            justification: |
              The assembly description provides high-level context for the documented library
              and is immediately discoverable on the api.md index page without navigation. An
              explicitly-supplied LibraryDescription option (surfaced via the
              --library-description CLI option / ApiMarkLibraryDescription MSBuild property)
              lets a team override or supply a description independent of the compiled
              AssemblyDescriptionAttribute, consistent with the cpp, vhdl, and
              DotNetEmitterSingleFile backends.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_AssemblyWithDescription_EmitsDescriptionParagraph
              - DotNetEmitterGradualDisclosure_Emit_LibraryDescriptionSupplied_OverridesAssemblyDescription
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitNamespacePages
            title: DotNetEmitterGradualDisclosure shall emit a separate Markdown page
              for each namespace in the assembly.
            justification: |
              Separate namespace pages allow AI agents and readers to navigate to a
              namespace summary and discover all types within it without reading the
              entire assembly index.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesNamespacePage
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesChildNamespacePage
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitGlobalNamespaceTypes
            title: DotNetEmitterGradualDisclosure shall document types declared without a
              namespace on a synthetic global-namespace page with working links.
            justification: |
              C# types declared in the global namespace are part of the public API. Emitting
              them under a `global-namespace` page (shown as "(global namespace)"), listed in
              api.md and reachable via breadcrumbs, type links and cref links, avoids a crash and
              keeps them discoverable without changing output for other assemblies.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespaceTypes_DoesNotThrowAndCreatesPages
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespaceTypes_ApiIndexListsGlobalNamespace
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespaceTypes_NamespacePageLinksToTypePages
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespaceTypes_BreadcrumbLinksToGlobalNamespacePage
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespaceTypes_CrefResolvesToTypePage
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespaceTypes_SignatureTypeLinksToTypePage
              - DotNetEmitterGradualDisclosure_Emit_NoGlobalNamespaceTypes_NoGlobalNamespaceOutput
              - TypeLinkResolver_Linkify_GlobalNamespaceType_LinksToGlobalNamespacePage
              - DotNetEmitter_GetNamespaceFolderPath_GlobalNamespace_ReturnsGlobalNamespaceFolder
              - DotNetEmitter_GetImmediateChildNamespaces_GlobalNamespace_IsSiblingRoot
              - DotNetEmitter_GetNamespaceDisplayName_GlobalNamespace_ReturnsPlaceholder
              - DotNetGenerator_ComputeRootNamespaces_GlobalNamespace_IsRootAndDoesNotHideOthers
              - TypeNameSimplifier_Simplify_GlobalContextNamespace_DoesNotStripOrThrow
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitNamespaceDocRemarksAndExamples
            title: DotNetEmitterGradualDisclosure shall emit the NamespaceDoc remarks
              and example parts after the namespace summary on the namespace page.
            justification: |
              A NamespaceDoc carrier can document a namespace with remarks and worked
              examples. Emitting the remarks paragraph and structured example parts after the
              summary on the namespace page — mirroring the type-level rendering — surfaces the
              full authored namespace documentation in gradual-disclosure output.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_NamespaceWithDoc_EmitsNamespaceRemarks
              - DotNetEmitterGradualDisclosure_Emit_NamespaceWithDoc_EmitsNamespaceExampleCodeBlock
              - DotNetEmitterGradualDisclosure_Emit_TypeWithListRemarks_RendersNumberedListInMarkdown
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitTypePages
            title: DotNetEmitterGradualDisclosure shall emit a separate Markdown page
              for each visible type in the assembly.
            justification: |
              Separate type pages allow gradual disclosure: an AI can read a namespace page
              to discover types, then open individual type pages on demand, consuming only
              as much context as required.
            tests: [DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesTypePage]
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitMemberDetailPages
            title: DotNetEmitterGradualDisclosure shall emit a dedicated detail page
              for each visible member of every type in gradual-disclosure output.
            justification: |
              Per-member pages enable AI agents to navigate directly to
              {Namespace}/{TypeName}/{MemberName}.md without reading unrelated members,
              keeping context consumption proportional to the task.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesMemberDetailPage
              - DotNetGenerator_AllMembers_GetSeparateFiles
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitSeparatePagesForCaseTwins
            title: DotNetEmitterGradualDisclosure shall emit a separate page for each
              of two members whose names differ only in case (for example Name and name-2).
            justification: |
              On case-insensitive filesystems (Windows, macOS), two members whose sanitized
              names differ only in case would produce colliding filenames. The registry gives each
              its own page, chosen by tier and then a numeric suffix, so nothing is lost.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_CaseCollision_CreatesSeparatePages
              - DotNetGenerator_Generate_CaseCollisionClass_CreatesSeparatePages
              - DotNetGenerator_Generate_CaseCollisionClass_NoPagesDifferOnlyInCase
              - DotNetGenerator_Generate_CaseCollisionClass_EachMemberHasOwnPage
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitMethodOverloadPage
            title: DotNetEmitterGradualDisclosure shall emit a single consolidated
              overload page when a type declares multiple overloads of the same method
              name.
            justification: |
              When a type declares multiple overloads of the same method name, combining them
              onto one page avoids redundant file proliferation and keeps the type page's
              member list concise. Each overload is distinguished by an H2 heading showing
              its full parameter signature.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesMethodOverloadPage
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitOperatorsPage
            title: DotNetEmitterGradualDisclosure shall emit a dedicated operators.md
              page for types that declare operator overloads.
            justification: |
              Grouping all operator overloads for a type onto a single operators.md page
              keeps the type page uncluttered and provides a predictable navigation target
              for readers interested in the operator API surface of a type.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesOperatorsPage
              - DotNetGenerator_Generate_TypeWithOperators_CreatesOperatorsPage
              - DotNetGenerator_Generate_TypeWithOperators_TypePageHasOperatorsSection
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitNestedTypePages
            title: DotNetEmitterGradualDisclosure shall recursively emit dedicated
              pages for nested types under their containing type's folder.
            justification: |
              C# types commonly nest supporting types within their declaring type. Emitting
              a dedicated page per nested type under the containing type's folder mirrors
              the C# type hierarchy in the file system and makes nested types independently
              addressable. This must hold even when the containing type is a pure
              namespace-like container with no own members/operators, since
              DotNetGenerator.CollectTypeCrefLinkIndex recurses into nested types
              unconditionally and a skipped nested-types section would leave dangling cref
              links.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_ValidModel_CreatesNestedTypePage
              - DotNetGenerator_Generate_NestedClass_ListedOnOuterClassPage
              - DotNetGenerator_Generate_NestedClass_CreatesNestedClassPage
              - DotNetGenerator_Generate_NestedClass_PageContainsSummary
              - DotNetGenerator_Generate_GradualDisclosure_MemberlessContainerType_WritesNestedTypePages
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EmitOperatorsSummaryDocumentation
            title: DotNetEmitterGradualDisclosure shall include XML summary documentation
              for each operator on the operators page.
            justification: |
              Including XML summaries makes the operators page self-contained for readers
              who only need the operator API without navigating to other pages.
            tests:
              - DotNetGenerator_Generate_TypeWithOperators_OperatorsPageContainsSummaries
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-SuppressPlaceholderWhenRemarksPresent
            title: DotNetEmitterGradualDisclosure shall suppress the "No description
              provided." placeholder on member-detail-page and type-page bodies when
              a summary is absent but remarks content is present, showing the
              placeholder only when both summary and remarks are absent.
            justification: |
              Member-detail-page and type-page bodies render both summary and remarks,
              so showing the no-description placeholder whenever a summary was absent
              — even though valid remarks content followed immediately below it — was
              misleading: it suggested the member was undocumented when it was not.
              Table-cell summary fallback (which never shows remarks) is unaffected,
              since the placeholder remains the only signal available there.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_MemberWithRemarksOnly_SuppressesPlaceholderAndShowsRemarks
              - DotNetEmitterGradualDisclosure_Emit_MemberWithNeitherSummaryNorRemarks_StillShowsPlaceholder
              - DotNetEmitterGradualDisclosure_Emit_TypeWithRemarksOnly_SuppressesPlaceholderAndShowsRemarksOnTypePage
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-ExtractBuildMemberPageIndex
            title: DotNetEmitterGradualDisclosure shall assign every member to the
              same gradual-disclosure page whether the page assignment is queried
              before emission (for cross-reference linking) or during emission (for
              writing).
            justification: |
              Full <see cref>/<seealso cref> cross-reference linking needs to know,
              for every member in the assembly, the exact gradual-disclosure page path
              it will be written to — before any page is written. Re-deriving the
              grouping logic (overload grouping, operator grouping, case-collision
              grouping, single-member fallback) a second time, even if initially
              equivalent, would create two sources of truth that could silently drift
              apart on a future edit to only one of them. This is satisfied by an
              internal static BuildMemberPageIndex function that shares the
              GroupMembersByFileName/GetOrderedOverloads/DecideGroupPageFileName
              helpers with the actual page writer (ProcessTypeMembers/
              ProcessOverloadGroup/ProcessCollisionMember), reproducing its exact
              member-grouping decisions without writing any Markdown, verified
              against the writer's actual output by a dedicated integration test,
              with no change to any existing generated output.
            tests:
              - BuildMemberPageIndex_AllEntries_MatchActualWrittenPages
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-WireCrefLinkContextThroughPageWriters
            title: DotNetEmitterGradualDisclosure shall render a resolvable `<see
              cref>`/`<seealso cref>` target as a real Markdown link in generated
              member and type pages, for every eligible documentation element except
              exception type/description text.
            justification: |
              Code-span-wrapped plain text for every cref is strictly less useful than
              a real clickable cross-reference whenever the target is actually present
              in the generated documentation. This is satisfied by constructing a
              CrefLinkContext (bound to the model's
              CrefTargets/MemberPageIndex/Resolver and this emitter's own visibility
              delegates) and passing it as the trailing argument to every
              ctx.XmlDocs.Get* call made while writing a page, except
              GetExceptions/GetExceptionDetails. Constructing the CrefLinkContext once
              per type-processing pass (re-scoped per folder via the record `with`
              expression where a page writer executes at a deeper folder than its
              caller) avoids rebuilding it freshly at every call site while keeping
              page-writer methods free of a direct emitter-instance dependency,
              consistent with the existing TypePageWriteContext/MethodDocContext
              pattern.
            tests:
              - CrefLinking_SeeCrefToVisibleType_RendersAsMarkdownLink
              - CrefLinking_SeeCrefToVisibleMember_RendersAsMarkdownLink
              - CrefLinking_SeeCrefToFilteredMember_RendersFallbackWithNoLink
              - CrefLinking_SeeCrefToExternalType_RendersFallbackWithNoLink
              - CrefLinking_SeeCrefMalformed_RendersFallbackWithNoLink
              - CrefLinking_SeeAlsoCrefToVisibleType_RendersAsMarkdownLink
              - DotNetGenerator_NamespacePage_NamespaceDocRemarksSeeCref_RendersAsLink
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-ParameterTableDefaults
            title: DotNetEmitterGradualDisclosure shall show each optional parameter's default value in the parameter table, rendered in C# source form for every supported constant kind.
            justification: |
              Readers of member pages need the defaults the signature carries, including
              null, default, enum, boolean, numeric, string, char and long constants.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_DefaultValueParameter_ShowsDefaultInParameterTable
              - DotNetEmitterGradualDisclosure_Emit_DefaultValueVariants_RenderDefaults
              - DotNetEmitterGradualDisclosure_Emit_CharAndLongDefaults_RenderDefaults
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-ParameterTableNullability
            title: DotNetEmitterGradualDisclosure shall show per-type nullability annotations on parameters and return types in generated pages.
            justification: |
              Nullability is part of the API contract; nested generic arguments such as
              Func return types carry their own flags that must not be lost.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_NullableParameterAndFuncReturn_RendersPerTypeFlags
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-RenderInitAccessors
            title: DotNetEmitterGradualDisclosure shall render init-only property accessors as init.
            justification: |
              Init-only setters differ from set accessors in the API contract.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_InitOnlyProperties_RenderInitAccessor
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-RenderGenericMethodSignatures
            title: DotNetEmitterGradualDisclosure shall render generic method signatures with their type parameters and constraints.
            justification: |
              Type parameters and where-constraints are needed to call a generic method correctly.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_GenericMethod_SignatureHasTypeParametersAndConstraints
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-RenderRecordAndStructKinds
            title: DotNetEmitterGradualDisclosure shall render the correct kind keywords (record, record struct, readonly struct and similar) in type signatures.
            justification: |
              The kind keyword conveys value versus reference semantics and mutability to readers.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_RecordAndStructKinds_ShowKindKeywords
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-HonorCodeLanguage
            title: DotNetEmitterGradualDisclosure shall tag each fenced example code block with its own language, and render prose example parts as paragraphs rather than fenced blocks.
            justification: |
              Examples may mix languages (for example XML and PowerShell); each block must be
              highlighted correctly, and prose carries no language.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_LangExample_TagsEachCodeBlockWithItsLanguage
              - DotNetEmitterGradualDisclosure_Emit_LangExampleInPara_TagsCodeBlocksAndKeepsProseAsParagraphs
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-WriteBreadcrumbs
            title: DotNetEmitterGradualDisclosure shall write a relative breadcrumb line, starting with an API Reference link to api.md, as the first paragraph under the heading of every type, member, overload, operators and combined page, including nested types and global-namespace types.
            justification: |
              Breadcrumbs let readers and agents navigate up to the API root, the containing namespace
              and type without a new layout mode. Namespace folders are recovered so that nested namespace
              and nested type pages link to the correct ancestors.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_AllPages_HaveApiReferenceBreadcrumb
              - DotNetEmitterGradualDisclosure_Emit_GlobalNamespacePages_HaveApiReferenceBreadcrumb
              - DotNetEmitterGradualDisclosure_Emit_Pages_HaveRelativeBreadcrumbs
              - DotNetEmitterGradualDisclosure_Emit_OverloadPage_HasBreadcrumb
              - DotNetEmitterGradualDisclosure_Emit_NestedType_BreadcrumbsIncludeOuterType
              - DotNetEmitterGradualDisclosure_Emit_MemberPage_FirstParagraphIsBreadcrumb
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-OverviewRowsShowFullParameters
            title: DotNetEmitterGradualDisclosure shall render overview rows with parameter names,
              defaults, nullability, tuples, and params, and mark non-public members with their
              accessibility.
            justification: |
              Overloads must be distinguishable from the overview, and protected members must be
              identifiable without opening the page.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_NullableMatrixAndParams_OverviewRowsMatchSignature
              - DotNetEmitterGradualDisclosure_Emit_ParamsConstructor_OverviewRowShowsParams
              - DotNetEmitterGradualDisclosure_Emit_ProtectedMember_OverviewRowHasProtectedMarker
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-PageHeadingsShowNullabilityAndParams
            title: DotNetEmitterGradualDisclosure shall render member page headings with nullability,
              tuples, and params.
            justification: |
              Headings of overloads must stay distinct and match the signature.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_MethodPageHeading_ShowsNullabilityAndParams
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-PageSignaturesHonorVisibility
            title: DotNetEmitterGradualDisclosure shall render modifiers and visibility-filtered accessors
              in member page signatures.
            justification: |
              Pages must show the same surface the selected visibility tier documents.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_InheritanceShapes_PagesShowModifiers
              - DotNetEmitterGradualDisclosure_Emit_AccessorShapes_PageSignatureHonorsVisibility
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-OverloadReturnTypes
            title: DotNetEmitterGradualDisclosure shall list the distinct return types of an overload group,
              in overload order, in the overview row.
            justification: |
              Overloads with differing return types must not be summarized by one arbitrary type.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_OverloadGroupRow_ListsDistinctReturnTypesInOrder
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-EscapedGenericHeadings
            title: DotNetEmitterGradualDisclosure shall escape angle brackets in headings, breadcrumbs, and
              link text, and attach each example only to the overload that documents it.
            justification: |
              Raw angle brackets are parsed as HTML and hide generic arguments, making sections look
              misattributed; text-only examples are prose, not code.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_OverloadPage_EscapesGenericHeadings
              - DotNetEmitterGradualDisclosure_Emit_OverloadPage_ExampleAttachedToDocumentingOverload
              - DotNetEmitterGradualDisclosure_Emit_TextOnlyExample_RendersAsProse
              - DotNetEmitterGradualDisclosure_Emit_AllFixtures_NoUnescapedAngleBracketsInHeadingsOrLinkLabels
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-GenericTypePages
            title: DotNetEmitterGradualDisclosure shall render generic type pages with an escaped heading,
              a Type Parameters table, and where constraints in signatures.
            justification: |
              Readers need the type parameter meanings and constraints on the page that introduces them.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_GenericTypePage_ShowsEscapedHeadingAndTypeParameters
              - DotNetEmitterGradualDisclosure_Emit_MultiParameterGenericType_ShowsPlaceholderAndConstraints
              - DotNetEmitterGradualDisclosure_Emit_GenericMethodPage_ShowsConstraintAndTypeParameters
              - DotNetEmitterGradualDisclosure_Emit_NestedTypeOfGenericHost_HasNoOwnTypeParameters
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-NamespaceNavigation
            title: DotNetEmitterGradualDisclosure shall render a breadcrumb on namespace pages, and a Start
              here link and Key Types column on api.md.
            justification: |
              Readers need a way back to the index and a pointer to the important types.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_NamespacePages_ShowBreadcrumb
              - DotNetEmitterGradualDisclosure_Emit_ApiPage_HasStartHereAndKeyTypes
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-OverloadIndexAggregation
            title: DotNetEmitterGradualDisclosure shall describe an overload group in its index row with
              the shared summary only when every overload has the same non-empty summary and a neutral text otherwise
              (including when any overload has no summary),
              and with every distinct return type, including void, in overload order.
            justification: |
              Taking the first overload's summary or return type misdescribes the other overloads.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_OverloadIndex_DifferingSummaries_UsesNeutralText
              - DotNetEmitterGradualDisclosure_Emit_OverloadIndex_IdenticalSummaries_UsesSharedSummary
              - DotNetEmitterGradualDisclosure_Emit_OverloadIndex_AllSummariesMissing_UsesNeutralText
              - DotNetEmitterGradualDisclosure_Emit_OverloadIndex_SomeSummariesMissing_UsesNeutralText
              - DotNetEmitterGradualDisclosure_Emit_OverloadIndex_ReturnColumn_ListsDistinctTypesIncludingVoid
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-OverloadPageSections
            title: DotNetEmitterGradualDisclosure shall write one heading per overload, attach the
              example only to the overload that documents it, and document each generic overload's type
              parameters in a table under its own heading.
            justification: |
              Overload pages are read section by section; each section must be self-contained and correctly attributed.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_OverloadPage_HasExactHeadings
              - DotNetEmitterGradualDisclosure_Emit_OverloadPage_ExampleOnlyUnderGenericHeading
              - DotNetEmitterGradualDisclosure_Emit_OverloadPage_GenericOverloadHasTypeParameterTable
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-OverloadCrefAnchors
            title: DotNetEmitterGradualDisclosure shall link a cref to a specific overload to that
              overload's heading anchor, using the GitHub heading slug rule, and keep the parameter
              types in the link text.
            justification: |
              A link to the group page alone cannot distinguish overloads; the anchor must match a real heading.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_OverloadCref_LinksToOverloadHeadingAnchor
              - DotNetEmitterGradualDisclosure_Emit_AllLinkAnchors_MatchRealHeadings
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-InlineCodeReferences
            title: DotNetEmitterGradualDisclosure shall render parameter, type-parameter, and language
              keyword references as inline code in every prose location of a member page.
            justification: |
              Names such as null or a parameter name read ambiguously as plain prose.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_InlineReferences_RenderAsCodeSpansEverywhere
          - id: ApiMarkDotNet-DotNetEmitterGradualDisclosure-LegalFileNames
            title: DotNetEmitterGradualDisclosure and DotNetEmitterSingleFile shall produce only
              file and folder names that are legal on Windows and Linux, case-insensitively unique,
              and consistent with every relative link.
            justification: |
              Explicit interface implementations, reserved device names such as CON, and types that
              differ only by case otherwise yield output that cannot be written or checked out on
              some platforms, or whose links resolve to the wrong file.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_AllVisibilities_FileNamesAreLegalAndLinksResolve
              - DotNetEmitterSingleFile_Emit_AllVisibilities_ProducesSingleLegalFile
              - DotNetEmitterGradualDisclosure_EmitToDisk_AllVisibility_WritesEveryPageToFileSystem

---
# TypeNameSimplifier unit requirements
sections:
  - title: ApiMarkDotNet Requirements
    sections:
      - title: TypeNameSimplifier Requirements
        requirements:
          - id: ApiMarkDotNet-TypeNameSimplifier-SimplifyPrimitiveAliases
            title: TypeNameSimplifier shall simplify C# system types to language aliases
              such as string, int, and bool.
            justification: |
              Readers expect C# signatures in documentation to use familiar language
              aliases instead of verbose CLR type names.
            tests: [TypeNameSimplifier_Simplify_Primitives_RenderLanguageAliases]
          - id: ApiMarkDotNet-TypeNameSimplifier-SimplifyArrayTypes
            title: TypeNameSimplifier shall render array types using C# bracket notation.
            justification: |
              Array types appear frequently in .NET APIs and must use the idiomatic T[]
              form rather than the CLR array type representation.
            tests: [TypeNameSimplifier_Simplify_ArrayType_ReturnsBracketNotation]
          - id: ApiMarkDotNet-TypeNameSimplifier-RenderNullableValueTypesWithQuestionMark
            title: TypeNameSimplifier shall render nullable value types in T? form.
            justification: |
              Documentation should present nullable value types using standard C# syntax
              rather than the more verbose Nullable<T> representation.
            tests:
              - TypeNameSimplifier_Simplify_NullableValueTypes_UseQuestionMarkForm
          - id: ApiMarkDotNet-TypeNameSimplifier-SimplifyWellKnownNamespaces
            title: TypeNameSimplifier shall use unqualified names for types in well-known
              namespaces.
            justification: |
              Types from System.Collections.Generic and System.Threading.Tasks appear
              frequently in public APIs and are universally recognized without their
              namespace prefix, keeping signatures compact.
            tests:
              - TypeNameSimplifier_Simplify_WellKnownNamespaceTypes_RenderWithoutNamespace
          - id: ApiMarkDotNet-TypeNameSimplifier-SimplifyContextNamespaceTypes
            title: TypeNameSimplifier shall strip the context namespace prefix from
              types in the same or nested namespace.
            justification: |
              When documenting a type, cross-references to other types in the same
              namespace are easier to read without the repeated namespace prefix.
            tests:
              - TypeNameSimplifier_Simplify_ContextNamespaceTypes_RenderWithoutSharedPrefix
              - TypeNameSimplifier_Simplify_ContextNamespaceTypes_NestedNamespace_StripsSharedPrefix
          - id: ApiMarkDotNet-TypeNameSimplifier-EmptyContextNamespace
            title: TypeNameSimplifier shall strip no namespace prefix, and not throw, when the context
              namespace is empty (the global namespace).
            justification: |
              Types in the global namespace have an empty context namespace; it must not be treated
              as a prefix that every type matches.
            tests:
              - TypeNameSimplifier_Simplify_GlobalContextNamespace_DoesNotStripOrThrow
          - id: ApiMarkDotNet-TypeNameSimplifier-SimplifyGenericArgumentsRecursively
            title: TypeNameSimplifier shall apply simplification recursively to generic
              type arguments.
            justification: |
              Complex APIs frequently nest generic types, so simplification has to work at
              every level to prevent signatures from becoming unreadable.
            tests:
              - TypeNameSimplifier_Simplify_GenericArguments_AreSimplifiedRecursively
          - id: ApiMarkDotNet-TypeNameSimplifier-AppendNullableReferenceSuffix
            title: TypeNameSimplifier shall append ? to nullable reference types.
            justification: |
              Nullable reference annotations communicate important API contracts and need a
              concise representation in generated signatures.
            tests:
              - TypeNameSimplifier_Simplify_NullableAnnotatedReferenceType_AppendsQuestionMark
              - TypeNameSimplifier_Simplify_NonAnnotatedReferenceType_DoesNotAppendQuestionMark
              - TypeNameSimplifier_Simplify_NullContextNamespace_ReturnsExactNames
          - id: ApiMarkDotNet-TypeNameSimplifier-PerTypeNullability
            title: TypeNameSimplifier shall apply nullable-reference flags per
              generic-argument position.
            justification: |
              Annotations such as Func<Wire, WireStyle?>? must appear on the correct type,
              matching compiler semantics.
            tests:
              - TypeNameSimplifier_Simplify_NullabilityFixtures_MatchReflectionOracle
              - TypeNameSimplifier_Simplify_FuncWithNullableResult_AnnotatesInnerAndOuter
              - TypeNameSimplifier_Simplify_GenericParameterAnnotations_RenderQuestionMarks
              - TypeNameSimplifier_Simplify_StructConstrainedGenericParameter_InheritedFlagTwo_NoQuestionMark
              - TypeNameSimplifier_Simplify_ExhaustedFlagArray_UsesContextDefault
          - id: ApiMarkDotNet-TypeNameSimplifier-PerTypeNullabilityArrays
            title: TypeNameSimplifier shall apply nullable-reference flags per array
              position, covering the array itself and its element type.
            justification: |
              An array can be nullable independently of its element type (string[]? versus
              string?[]), so each position needs its own flag.
            tests:
              - TypeNameSimplifier_Simplify_MultiDimensionalArrayWithNullability_AnnotatesPerPosition
              - TypeNameSimplifier_Simplify_MultiDimensionalArray_AppendsRankSuffix
          - id: ApiMarkDotNet-TypeNameSimplifier-UnwrapByReferenceTypes
            title: TypeNameSimplifier shall unwrap by-reference types to their element
              type name without consuming a nullable flag.
            justification: |
              ref, out, and in parameters are represented as by-reference wrappers; the
              keyword is rendered by the caller, so the type name must be that of the
              underlying element.
            tests:
              - TypeNameSimplifier_Simplify_ByReferenceType_UnwrapsToElementTypeName
              - TypeNameSimplifier_Simplify_ByReferenceWithNullability_AnnotatesElementType
          - id: ApiMarkDotNet-TypeNameSimplifier-InheritNullableContext
            title: TypeNameSimplifier shall use the inherited NullableContext as the
              nullable flag for positions without an explicit NullableAttribute.
            justification: |
              The compiler omits NullableAttribute when it matches the enclosing context, so
              annotations would be lost if the inherited context were ignored.
            tests:
              - TypeNameSimplifier_Simplify_NullableContextOnType_IsInherited
              - TypeNameSimplifier_Simplify_NullableContextOnMethod_OverridesTypeContext
              - TypeNameSimplifier_Simplify_ExplicitNullableAttribute_OverridesContext

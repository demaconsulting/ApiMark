---
# cspell:ignore notnull
# DotNetEmitter unit requirements
sections:
  - title: ApiMarkDotNet Requirements
    sections:
      - title: DotNetEmitter Requirements
        requirements:
          - id: ApiMarkDotNet-DotNetEmitter-DispatchToFormatSpecificEmitter
            title: DotNetEmitter shall dispatch to the appropriate format-specific
              sub-emitter based on EmitConfig.Format.
            justification: |
              The IApiEmitter contract requires a single Emit entry point. DotNetEmitter
              reads the requested OutputFormat and forwards the call — along with the
              factory, config, and context — to DotNetEmitterGradualDisclosure or
              DotNetEmitterSingleFile so that the format-selection logic is concentrated
              in one place.
            tests:
              - DotNetEmitter_Emit_GradualDisclosureFormat_ProducesMultipleFiles
              - DotNetEmitter_Emit_SingleFileFormat_ProducesSingleApiFile
          - id: ApiMarkDotNet-DotNetEmitter-RejectNullArguments
            title: DotNetEmitter.Emit shall throw ArgumentNullException when factory,
              config, or context is null.
            justification: |
              Null arguments at the Emit entry point would produce unpredictable failures
              during generation; rejecting them immediately gives callers precise,
              actionable failures.
            tests:
              - DotNetEmitter_Emit_NullFactory_ThrowsArgumentNullException
              - DotNetEmitter_Emit_NullConfig_ThrowsArgumentNullException
              - DotNetEmitter_Emit_NullContext_ThrowsArgumentNullException
          - id: ApiMarkDotNet-DotNetEmitter-ComputeNamespaceFolderPath
            title: DotNetEmitter shall compute the file-system folder path for a namespace,
              treating root namespaces as atomic path segments and child namespaces
              as slash-separated paths.
            justification: |
              Both sub-emitters rely on a consistent folder path convention so that the
              generated Markdown tree is navigable and predictable. Centralizing the path
              computation in a single static method ensures that gradual-disclosure and
              single-file emitters agree on folder structure.
            tests:
              - DotNetEmitter_GetNamespaceFolderPath_RootNamespace_ReturnsDottedName
              - DotNetEmitter_GetNamespaceFolderPath_ChildNamespace_ReturnsSlashSeparated
              - DotNetEmitter_GetNamespaceFolderPath_UnknownNamespace_ReturnsFullName
          - id: ApiMarkDotNet-DotNetEmitter-ShowDirectInheritanceInTypeSignature
            title: DotNetEmitter shall include the direct base class and directly
              declared interfaces in the type signature, omitting well-known implicit
              bases such as System.Object, System.ValueType, System.Enum, and System.MulticastDelegate.
            justification: |
              The direct inheritance list tells AI agents the contract a type satisfies
              without requiring them to navigate to the source file. Suppressing well-known
              implicit bases avoids noise that adds no information.
            tests:
              - DotNetGenerator_Generate_SampleImplementation_TypeSignatureShowsInterface
              - DotNetGenerator_Generate_EnumTypeSignature_HasNoBaseClass
          - id: ApiMarkDotNet-DotNetEmitter-EmitOperatorsPageWithSymbolHeadings
            title: DotNetEmitter shall use C# operator symbols as headings on the
              operators page.
            justification: |
              C# operator symbols (operator +, operator ==, implicit/explicit) are the form
              developers expect to read, so each heading must render the operator in its
              idiomatic symbolic form rather than as a method name.
            tests:
              - DotNetGenerator_Generate_TypeWithOperators_OperatorsPageUsesSymbolHeadings
          - id: ApiMarkDotNet-DotNetEmitter-EmitConversionOperators
            title: DotNetEmitter shall document conversion operators on the operators
              page and include their summaries.
            justification: |
              Conversion operators are part of the public API surface and must be included
              on the operators page with their XML summary so readers understand the
              conversion intent without navigating elsewhere.
            tests:
              - DotNetGenerator_Generate_TypeWithConversionOperators_OperatorsPageContainsSummaries
              - DotNetGenerator_Generate_ConversionOperatorReturningNestedType_OperatorsPageContainsSummary
          - id: ApiMarkDotNet-DotNetEmitter-EmitConversionOperatorsWithConversionSyntax
            title: DotNetEmitter shall use conversion syntax headings for conversion
              operators on the operators page.
            justification: |
              Implicit and explicit conversion operators have distinct syntax from arithmetic
              operators. Rendering them with conversion syntax (e.g., "implicit operator
              TargetType(SourceType)") lets readers identify the source and target types at
              a glance.
            tests:
              - DotNetGenerator_Generate_TypeWithConversionOperators_OperatorsPageUsesConversionSyntax
          - id: ApiMarkDotNet-DotNetEmitter-RenderClassModifiersInTypeSignature
            title: DotNetEmitter shall include the abstract, sealed, or static modifier
              in the type signature for classes that declare that modifier.
            justification: |
              Generated type signatures must match the C# declaration so that readers
              can immediately identify abstract, sealed, and static classes without
              consulting the source file.
            tests:
              - DotNetEmitter_BuildTypeSignature_AbstractClass_ContainsAbstractModifier
              - DotNetEmitter_BuildTypeSignature_SealedClass_ContainsSealedModifier
              - DotNetEmitter_BuildTypeSignature_StaticClass_ContainsStaticModifier
          - id: ApiMarkDotNet-DotNetEmitter-RenderInitOnlyPropertyAccessor
            title: DotNetEmitter shall emit init; rather than set; in property signatures
              for C# 9+ init-only setters.
            justification: |
              Init-only setters are semantically distinct from regular setters — they can
              only be assigned during object initialization. Rendering them as set; would
              mislead readers into believing the property is mutable after construction.
            tests: [DotNetEmitter_BuildPropertyAccessors_InitOnlySetter_EmitsInit]
          - id: ApiMarkDotNet-DotNetEmitter-RenderConstantFieldValue
            title: DotNetEmitter shall append the compiler-folded constant value to a
              field signature when the field has a compile-time constant (HasConstant),
              including enum member fields.
            justification: |
              Readers and AI agents need to see the actual value of a const field or enum
              member to use the API correctly without opening the implementation. Mono.Cecil
              stores enum member constants using the enum's underlying primitive type, so a
              single formatter renders both plain const fields and enum members correctly.
            tests:
              - DotNetEmitter_BuildFieldSignature_ConstStringField_AppendsQuotedValue
              - DotNetEmitter_BuildFieldSignature_ConstIntField_AppendsNumericValue
              - DotNetEmitter_BuildFieldSignature_ConstBoolField_AppendsLowercaseBooleanValue
              - DotNetEmitter_BuildFieldSignature_EnumMemberWithExplicitValue_AppendsUnderlyingNumericValue
              - DotNetEmitter_BuildFieldSignature_ConstCharField_EscapesNulCharacter
              - DotNetEmitter_FormatConstantValue_StringWithControlCharacters_EscapesAllOfThem
              - DotNetEmitter_FormatConstantValue_UnnamedControlCharacter_FallsBackToUnicodeEscape
              - DotNetEmitter_FormatConstantValue_C1ControlCharacter_FallsBackToUnicodeEscape
          - id: ApiMarkDotNet-DotNetEmitter-RenderDefaultParameterValues
            title: DotNetEmitter shall render the default value of optional parameters in method and operator signatures.
            justification: |
              Default values are part of the callable contract. Constants, enum members (or a numeric
              cast when no member matches), decimal and date-time constants, and
              DefaultParameterValue attributes must all be rendered so readers know what a call omits.
            tests:
              - DotNetEmitter_BuildMethodSignature_DefaultValues_RendersDefaults
              - DotNetEmitter_BuildMethodSignature_ExtendedDefaultValues_RendersDefaults
              - DotNetEmitter_FormatParameterDefault_DefaultParameterValueAttribute_RendersValue
              - DotNetEmitter_FormatParameterDefault_DecimalConstantAttribute_HandlesSignedAndOutOfRangeArguments
              - DotNetEmitter_BuildOperatorSignature_ParameterWithDefault_RendersDefault
          - id: ApiMarkDotNet-DotNetEmitter-OmitDefaultValuesFromDisplayNames
            title: DotNetEmitter shall not include parameter default values in method display names or file names.
            justification: |
              Display names and file names are used for overload grouping and file naming; they must
              stay short and stable regardless of default values.
            tests:
              - DotNetEmitter_BuildMethodDisplayName_DefaultValues_DoesNotIncludeDefaults
          - id: ApiMarkDotNet-DotNetEmitter-RenderNonFiniteFloatingPointValues
            title: DotNetEmitter shall render NaN and infinite float and double constants as the named members of those types.
            justification: |
              The invariant-culture text of these values (NaN, Infinity) is not valid C#; the named
              members (double.NaN, float.PositiveInfinity, and so on) read correctly in signatures.
            tests:
              - DotNetEmitter_FormatConstantValue_SpecialFloatingPointValues_RendersNamedMembers
              - DotNetEmitter_BuildMethodSignature_ExtendedDefaultValues_RendersDefaults
          - id: ApiMarkDotNet-DotNetEmitter-RenderRecordKeywords
            title: DotNetEmitter shall render the record and record struct keywords, including readonly record struct, in type signatures.
            justification: |
              Records are a distinct source-level kind; showing them as plain classes or structs
              misrepresents the API.
            tests:
              - DotNetEmitter_BuildTypeSignature_RecordKinds_RenderRecordKeywords
          - id: ApiMarkDotNet-DotNetEmitter-RenderStructModifiers
            title: DotNetEmitter shall render the readonly and ref modifiers of structs in type signatures.
            justification: |
              Readonly and ref struct modifiers tell readers how a type behaves and where it may be used.
            tests:
              - DotNetEmitter_BuildTypeSignature_StructKinds_RenderStructModifiers
          - id: ApiMarkDotNet-DotNetEmitter-SuppressImplicitRecordEquatable
            title: DotNetEmitter shall omit the compiler-implied IEquatable of the record itself from a record's base list while keeping explicitly declared interfaces.
            justification: |
              Source never spells out the implicit record equality interface, so showing it is noise;
              hand-written types that implement it, and other interfaces on a record, remain information.
            tests:
              - DotNetEmitter_BuildTypeSignature_SelfEquatable_SuppressedOnlyForRecords
          - id: ApiMarkDotNet-DotNetEmitter-RenderGenericMethodTypeParameters
            title: DotNetEmitter shall render generic method type parameters in method signatures and display names.
            justification: |
              Generic method type parameters are required to call the method correctly and to tell
              overloads apart.
            tests:
              - DotNetEmitter_BuildMethodSignature_GenericMethods_ShowTypeParameters
          - id: ApiMarkDotNet-DotNetEmitter-RenderGenericMethodConstraints
            title: DotNetEmitter shall render class, struct, unmanaged, type, and new() where constraints in method signatures.
            justification: |
              Generic constraints determine which type arguments a caller may supply.
            tests:
              - DotNetEmitter_BuildMethodSignature_GenericMethods_ShowConstraints
          - id: ApiMarkDotNet-DotNetEmitter-RenderNotNullConstraint
            title: DotNetEmitter shall render the notnull constraint, ahead of new(), for generic parameters that carry it, and nothing for unconstrained parameters.
            justification: |
              The notnull constraint is encoded only through nullable metadata, so it must be
              recovered explicitly; otherwise the signature would hide a real restriction.
            tests:
              - DotNetEmitter_BuildMethodSignature_NotNullConstraint_RendersNotNull
          - id: ApiMarkDotNet-DotNetEmitter-RenderPerTypeNullability
            title: DotNetEmitter shall render nullable reference annotations at each type position (generic arguments, array elements, parameters, returns, properties, fields, events), honoring the inherited NullableContext and leaving oblivious code unannotated.
            justification: |
              Nullability metadata is positional and inherited from the member, type, or module;
              signatures that ignore it would mislead callers about null handling.
            tests:
              - DotNetEmitter_BuildMemberSignature_NullabilityPositions_RendersAnnotations
              - DotNetEmitter_ResolveNullableContext_ResolvesInheritedContext
              - DotNetEmitter_CreateMemberTypeNullability_ReadsPrimaryTypeAnnotation
          - id: ApiMarkDotNet-DotNetEmitter-RenderGlobalNamespace
            title: DotNetEmitter shall map the global namespace to the global-namespace folder
              and the (global namespace) display name, and treat it as a sibling root.
            justification: |
              Types declared without a namespace must have a stable folder, a readable display
              name, and a root of their own so they are neither dropped nor nested under
              another namespace.
            tests:
              - DotNetEmitter_GetNamespaceFolderPath_GlobalNamespace_ReturnsGlobalNamespaceFolder
              - DotNetEmitter_GetImmediateChildNamespaces_GlobalNamespace_IsSiblingRoot
              - DotNetEmitter_GetNamespaceDisplayName_GlobalNamespace_ReturnsPlaceholder
              - DotNetGenerator_ComputeRootNamespaces_GlobalNamespace_IsRootAndDoesNotHideOthers
          - id: ApiMarkDotNet-DotNetEmitter-RenderParamsKeyword
            title: DotNetEmitter shall render the params (or params collection) modifier on parameters
              in method, constructor, and delegate signatures.
            justification: |
              Dropping params changes the documented calling convention of the member.
            tests:
              - DotNetEmitter_BuildMemberSignature_NullableMatrixAndParams_RendersExactSignature
              - DotNetEmitter_BuildDelegateSignature_ParamsDelegate_RendersParamsKeyword
          - id: ApiMarkDotNet-DotNetEmitter-RenderInheritanceModifiers
            title: DotNetEmitter shall render new, virtual, override, sealed override, abstract, and static modifiers
              on method, property, and event signatures, and none on interface members, static members,
              or interface implementations.
            justification: |
              Readers must know whether a member can be or has been overridden.
            tests:
              - DotNetEmitter_BuildMemberSignature_InheritanceShapes_RendersModifiers
              - DotNetEmitter_BuildMemberSignature_HidingAndStaticEvent_RendersNewAndStatic
              - DotNetEmitter_BuildMethodSignature_HidingVirtualAndOverload_RendersNewOnlyOnHider
          - id: ApiMarkDotNet-DotNetEmitter-HideInvisibleAccessors
            title: DotNetEmitter shall omit property accessors that are not visible at the selected
              visibility tier.
            justification: |
              A private or internal setter is not part of the documented surface at the public tier;
              showing it leaks implementation detail and is incorrect.
            tests:
              - DotNetEmitter_BuildMemberSignature_AccessorShapes_HidesNonVisibleAccessors
          - id: ApiMarkDotNet-DotNetEmitter-ConsistentNullableTypeText
            title: DotNetEmitter shall render nullability, defaults, tuples, and params identically in
              overview rows, page headings, and signature blocks.
            justification: |
              Rows and headings that differ from the signature block mislead readers and make
              overloads indistinguishable.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_MatrixTypes_RowParametersEqualSignatureParameters
              - DotNetEmitterGradualDisclosure_Emit_AllFixtures_NeverRenderNullableVoid
          - id: ApiMarkDotNet-DotNetEmitter-InheritedMembers
            title: DotNetEmitter shall list the members a type inherits from its base types in an
              Inherited Members section grouped by declaring type, excluding overridden, hidden,
              constructor, operator, and Object members, without creating member pages.
            justification: |
              Readers of a derived type need to discover what it inherits; the listing must not
              duplicate overridden members, must not enter coverage or cross-reference indexes, and
              must degrade to a note when a base assembly cannot be resolved.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_InheritedMembers_ListedPerDeclaringTypeWithoutOverridesOrObjectMembers
              - DotNetEmitterGradualDisclosure_Emit_InheritedMembers_DoNotCreateMemberPages
              - DotNetEmitterSingleFile_Emit_InheritedMembers_ListedPerDeclaringType
              - DotNetEmitterGradualDisclosure_Emit_UnresolvableBase_RendersNoteAndDoesNotThrow
              - DotNetEmitterGradualDisclosure_Emit_ExternalBaseWithReferences_ListsExternalMembers
              - DocumentationCoverageChecker_Check_InheritedMembers_AreNotChecked
          - id: ApiMarkDotNet-DotNetEmitter-InheritDocPlaceholder
            title: DotNetEmitter shall render the text "Inherits documentation from base member." for a
              member whose bare inheritdoc cannot be resolved, and the resolved text when it can.
            justification: |
              An unresolved inheritdoc is documented upstream; showing "No description provided."
              wrongly implies missing documentation.
            tests:
              - XmlDocReader_GetEffectiveSummary_UnresolvedInheritDoc_ReturnsPlaceholder
              - DotNetEmitterGradualDisclosure_Emit_InheritDoc_UnresolvedRendersPlaceholderResolvedRendersText
          - id: ApiMarkDotNet-DotNetEmitter-RecordPrimaryConstructorSummary
            title: DotNetEmitter shall replace the compiler-copied type summary on a record's primary
              constructor with "Initializes a new instance of the `Type` record." and preserve
              explicitly documented constructors.
            justification: |
              The compiler copies the record's summary onto the primary constructor, so the
              constructor would otherwise repeat the type description verbatim.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_RecordPrimaryConstructor_UsesStandardSummary
              - DotNetEmitterGradualDisclosure_Emit_RecordExplicitConstructor_PreservesSummary
              - DotNetEmitterSingleFile_Emit_RecordPrimaryConstructor_UsesStandardSummary
          - id: ApiMarkDotNet-DotNetEmitter-InheritedMembersHonorTier
            title: DotNetEmitter shall list inherited members per declaring base type at the configured
              visibility tier (public; public and protected; every non-private member), skipping
              overridden or hidden members, resolve external bases through reference assemblies, and
              link each "Inherited from" heading only to a page that exists, including nested bases.
            justification: |
              Inherited members must match what a consumer can actually use at the selected tier, and
              a heading must never link to a page that was not emitted.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_InheritedMembers_HonorsVisibilityTier
              - DotNetEmitterGradualDisclosure_Emit_AbstractBase_ListsEachMemberOnceAndSkipsOverridden
              - DotNetEmitterGradualDisclosure_Emit_ExternalBase_ProtectedTier_ListsProtectedField
              - DotNetEmitterGradualDisclosure_Emit_ExternalBase_AllMembersOverridden_NoSection
              - DotNetEmitterGradualDisclosure_Emit_ExternalBase_Unmapped_RendersPlainTextHeading
              - DotNetEmitterGradualDisclosure_Emit_ExternalBase_Mapped_LinksIntoExternalDocs
              - DotNetEmitterGradualDisclosure_Emit_GenericAndNestedBases_RenderExpectedHeadings
              - DotNetEmitterGradualDisclosure_Emit_InheritedFromLinks_ResolveToEmittedPages
              - DotNetEmitterSingleFile_Emit_InheritedMembers_ProtectedTierListsProtectedMembers
          - id: ApiMarkDotNet-DotNetEmitter-ExternalInheritDocEndToEnd
            title: DotNetEmitter shall resolve bare inheritdoc against the real XML documentation of
              referenced assemblies across one and two hops in both output formats.
            justification: |
              Documentation inherited from an external base must appear end to end, not only in
              unit-level resolver tests.
            tests:
              - DotNetEmitterSingleFile_Emit_ExternalInheritDoc_ResolvesOneAndTwoHopsFromReferenceXml
              - DotNetGenerator_Parse_ExternalBaseWithReferencePaths_ResolvesInheritedDocumentation
              - DotNetGenerator_Parse_ExternalBaseTwoHops_ResolvesInheritedDocumentationAcrossBothHops
          - id: ApiMarkDotNet-DotNetEmitter-NewModifierAllMemberKinds
            title: DotNetEmitter shall render the new modifier on fields, constants, properties, events,
              and methods that hide an accessible base member of any kind with the same name, and
              shall not render it for private base members or members without a base counterpart.
            justification: |
              Metadata does not record the new modifier; recovering it from the compiler's hiding rule
              keeps signatures compilable. Misses are preferred over false positives.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_NewModifier_RenderedForEveryHidingMemberKind
              - DotNetEmitterGradualDisclosure_Emit_NewModifier_BaseTypeMembersHaveNone
          - id: ApiMarkDotNet-DotNetEmitter-RecoverableConstraints
            title: DotNetEmitter shall render the notnull, unmanaged, struct, class, class?, new(), and
              nullable type constraints that metadata allows recovering, and no clause for
              unconstrained parameters.
            justification: |
              Generic signatures are incomplete without their constraints.
            tests:
              - DotNetEmitterGradualDisclosure_Emit_GenericConstraints_RenderedForEveryRecoverableShape

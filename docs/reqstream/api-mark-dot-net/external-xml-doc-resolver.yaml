---
# ExternalXmlDocResolver unit requirements
sections:
  - title: ApiMarkDotNet Requirements
    sections:
      - title: ExternalXmlDocResolver Requirements
        requirements:
          - id: ApiMarkDotNet-ExternalXmlDocResolver-LocateAndCacheReferencedAssemblyDocs
            title: ExternalXmlDocResolver shall locate a referenced assembly's XML
              documentation file (via a sibling `.xml` file or a `ref/`/`lib/` folder-segment
              swap fallback), lazily parse it on first use, and cache both per-file
              and per-(declaring-assembly-hint, member-ID) results (including misses)
              so repeated lookups never re-touch disk.
            justification: >
              Cross-assembly `<inheritdoc />` resolution needs to find and read a
              referenced assembly's own XML documentation file, but reference-assembly
              lists can be large (e.g. hundreds of transitive NuGet dependencies)
              and
              most of their documentation is never needed by a given generation run.
              Eagerly parsing every configured reference path up front would waste
              time
              and memory; parsing lazily on first access, and caching both file-level
              parse results and lookup results keyed by a composite of the
              declaring-assembly hint and member ID (including misses), ensures the
              cost is paid at most once per file that is actually consulted. The
              hint is included in the cache key -- rather than caching by member ID
              alone -- because XML documentation member IDs do not carry assembly
              identity, so a lookup for one hint must never be served another
              hint's cached result.
            tests:
              - ExternalXmlDocResolver_TryGetMember_SiblingXmlPresent_ReturnsMember
              - ExternalXmlDocResolver_TryGetMember_NoDocAnywhere_ReturnsNull
              - ExternalXmlDocResolver_TryGetMember_RefLibFolderSwap_LibXmlPresentUnderRefDll_ReturnsMember
              - ExternalXmlDocResolver_TryGetMember_RefLibFolderSwap_RefXmlPresentUnderLibDll_ReturnsMember
              - ExternalXmlDocResolver_TryGetMember_SecondReferencePathMatches_ReturnsMemberFromSecondPath
              - ExternalXmlDocResolver_TryGetMember_CachesParsedDocAcrossCalls_DeletedFileStillResolvesSecondCall
              - ExternalXmlDocResolver_TryGetMember_EmptyReferencePathList_ReturnsNull
              - ExternalXmlDocResolver_TryGetMember_CorruptXmlDocFile_ReturnsNullWithoutThrowing
              - ExternalXmlDocResolver_TryGetMember_RepeatedMissForSameMember_DoesNotReReadDiskAfterFirstMiss
          - id: ApiMarkDotNet-ExternalXmlDocResolver-RejectNullReferencePaths
            title: ExternalXmlDocResolver constructor shall throw ArgumentNullException
              when referenceAssemblyPaths is null.
            justification: >
              Failing fast with ArgumentNullException at construction gives callers
              (DotNetGenerator.Parse) a clear, immediate error rather than a deferred
              NullReferenceException the first time TryGetMember iterates the null
              list,
              consistent with the null-argument-rejection convention used throughout
              ApiMark's constructors and Parse/Emit entry points.
            tests:
              - ExternalXmlDocResolver_Constructor_NullReferencePaths_ThrowsArgumentNullException
          - id: ApiMarkDotNet-ExternalXmlDocResolver-ProbeHintedAssemblyBeforeFullScan
            title: ExternalXmlDocResolver shall accept an optional declaring-assembly-name
              hint per lookup and resolve a member declared by that assembly without
              locating and parsing every configured reference path's XML documentation,
              while still resolving correctly when the hint is absent, stale, or does not
              match any configured reference path.
            justification: >
              With MSBuild's auto-harvested ReferencePaths default, the configured
              reference assembly list can contain every resolved dependency of a
              project -- often hundreds of transitive NuGet packages, the vast
              majority unrelated to any given <inheritdoc/> target. Without a hint,
              a single miss forces every configured reference assembly's XML
              documentation file to be located and parsed. DotNetGenerator already
              knows (from Mono.Cecil metadata) which assembly actually declares each
              inheritance target, so passing that as a hint lets the common case
              resolve with a single, targeted file access instead of scanning the
              entire auto-harvested dependency set. A missing, stale, or incorrect
              hint must never cause a real match to be missed, so the full scan
              fallback is always attempted when the hinted probe does not resolve
              the member.
            tests:
              - ExternalXmlDocResolver_TryGetMemberWithHint_CorrectHint_OnlyProbesHintedPathNotOthers
              - ExternalXmlDocResolver_TryGetMemberWithHint_HintMatchesNoConfiguredPath_FallsBackToFullScan
              - ExternalXmlDocResolver_TryGetMemberWithHint_HintMatchesConfiguredPathButMemberMissing_FallsBackToFullScan

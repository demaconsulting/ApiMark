---
# DotNetEmitterSingleFile unit requirements
sections:
  - title: ApiMarkDotNet Requirements
    sections:
      - title: DotNetEmitterSingleFile Requirements
        requirements:
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitAllApiIntoSingleFile
            title: DotNetEmitterSingleFile shall emit all assembly API documentation
              into a single api.md file.
            justification: |
              Single-file output provides a compact, linear reference for contexts where a
              hierarchical file tree is unwanted, such as embedding documentation in a pull
              request, PDF compilation, or a chatbot context window.
            tests:
              - DotNetEmitterSingleFile_Emit_ValidModel_CreatesExactlyOneWriter
              - DotNetEmitterSingleFile_Emit_ValidModel_CreatesApiFileOnly
              - DotNetEmitterSingleFile_Emit_ValidModel_ApiFileContainsAssemblyHeading
              - DotNetEmitterSingleFile_Emit_ValidModel_ApiFileContainsNamespaceHeading
              - DotNetEmitterSingleFile_Emit_ValidModel_ApiFileContainsTypeHeading
              - DotNetGenerator_Generate_SingleFileOutput_WritesSingleApiMarkdown
              - DotNetGenerator_SingleFile_MethodWithExample_EmitsCodeBlock
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-OffsetHeadingsByHeadingDepth
            title: DotNetEmitterSingleFile shall offset all heading levels in the
              output by the HeadingDepth value specified in EmitConfig.
            justification: |
              HeadingDepth allows the generated content to be embedded into a larger
              document without conflicting with the host document's heading hierarchy.
              A HeadingDepth of 1 produces H1/H2/H3; a value of 2 produces H2/H3/H4.
            tests:
              - DotNetEmitterSingleFile_Emit_NonDefaultHeadingDepth_OffsetsHeadings
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitAssemblyDescription
            title: DotNetEmitterSingleFile shall emit a paragraph following the assembly-level
              heading containing an explicitly-supplied LibraryDescription option when
              present, falling back to the compiled AssemblyDescriptionAttribute value
              when LibraryDescription is null, empty, or consists only of whitespace.
            justification: |
              The assembly description provides high-level context for the documented library
              and is immediately discoverable in single-file output without navigation. An
              explicitly-supplied LibraryDescription option (surfaced via the
              --library-description CLI option / ApiMarkLibraryDescription MSBuild property)
              lets a team override or supply a description independent of the compiled
              AssemblyDescriptionAttribute, consistent with the cpp and vhdl backends.
            tests:
              - DotNetEmitterSingleFile_Emit_AssemblyWithDescription_EmitsDescriptionParagraph
              - DotNetEmitterSingleFile_Emit_LibraryDescriptionSupplied_OverridesAssemblyDescription
              - DotNetEmitterSingleFile_Emit_LibraryDescriptionWhitespace_FallsBackToAssemblyDescription
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitNamespaceDocSummary
            title: DotNetEmitterSingleFile shall emit the NamespaceDoc XML summary
              as a paragraph following the namespace heading.
            justification: |
              Namespace descriptions authored via the NamespaceDoc convention must appear in
              single-file output so readers have namespace context without navigating separate
              pages.
            tests:
              - DotNetEmitterSingleFile_Emit_NamespaceWithDoc_EmitsNamespaceSummary
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitNamespaceDocRemarksAndExamples
            title: DotNetEmitterSingleFile shall emit the NamespaceDoc remarks and
              example parts after the namespace summary.
            justification: |
              A NamespaceDoc carrier can document a namespace with remarks and worked
              examples. Emitting the remarks paragraph and structured example parts after the
              summary — mirroring the type-level rendering — surfaces the full authored
              namespace documentation in single-file output.
            tests:
              - DotNetEmitterSingleFile_Emit_NamespaceWithDoc_EmitsNamespaceRemarks
              - DotNetEmitterSingleFile_Emit_NamespaceWithDoc_EmitsNamespaceExampleCodeBlock
              - DotNetEmitterSingleFile_Emit_TypeWithListRemarks_RendersTableInMarkdown
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-SuppressPlaceholderWhenRemarksPresent
            title: DotNetEmitterSingleFile shall render a type's or member's
              `<summary>` via GetSummaryMarkdown (multi-line list rendering) and
              suppress the "No description provided." placeholder when a
              `<summary>` is absent but `<remarks>` content is present, at both
              the type-section and member-section level.
            justification: |
              GetSummary always collapsed a `<summary>` to a single line, which
              destroyed `<list>` structure in single-file output just as it did in
              gradual-disclosure output; switching to GetSummaryMarkdown fixes
              list rendering in both type and member sections. Separately, showing
              "No description provided." immediately above visible `<remarks>`
              content read oddly when a member or type had `<remarks>` but no
              `<summary>` (e.g. a `[GeneratedRegex]` method), so the placeholder is
              now suppressed whenever remarks are present, mirroring the identical
              rule already applied in DotNetEmitterGradualDisclosure.
            tests:
              - DotNetEmitterSingleFile_Emit_TypeWithListSummary_RendersNumberedListInMarkdown
              - DotNetEmitterSingleFile_Emit_MemberWithListSummary_RendersNumberedListInMarkdown
              - DotNetEmitterSingleFile_Emit_TypeWithRemarksOnly_SuppressesPlaceholderAndShowsRemarks
              - DotNetEmitterSingleFile_Emit_MemberWithRemarksOnly_SuppressesPlaceholderAndShowsRemarks
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitCompactMemberBulletList
            title: DotNetEmitterSingleFile shall emit a compact bullet list of member
              names and summaries before the per-member heading sections within each
              type section.
            justification: |
              The bullet list provides a quick overview of all members before diving into the
              detail sections, reducing reading time for large types.
            tests:
              - DotNetEmitterSingleFile_Emit_TypeWithMembers_EmitsBulletListBeforeMemberHeadings
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitMembersConstructorsFirst
            title: DotNetEmitterSingleFile shall emit constructor members before all
              other members, with remaining members ordered alphabetically.
            justification: |
              Constructors are the primary entry point for using a type; placing them first
              matches the reader's natural expectation when learning an API.
            tests:
              - DotNetEmitterSingleFile_Emit_TypeWithConstructorAndMethods_ConstructorAppearsFirst
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-SkipMemberListForDelegates
            title: DotNetEmitterSingleFile shall omit the member listing section for
              delegate types.
            justification: |
              Delegate types expose compiler-generated members (Invoke, BeginInvoke, EndInvoke)
              that are not meaningful API content; omitting them keeps the delegate section
              focused on signature and description.
            tests: [DotNetEmitterSingleFile_Emit_DelegateType_NoMemberSectionsEmitted]
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitNestedTypeParentNotice
            title: DotNetEmitterSingleFile shall emit a parent-context notice paragraph
              for nested types indicating their containing type.
            justification: |
              In single-file output there is no folder hierarchy to convey nesting
              relationships; an explicit notice paragraph makes the containing type
              relationship discoverable.
            tests: [DotNetEmitterSingleFile_Emit_NestedType_EmitsParentNotice]
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-EmitPlainTextParameterTypes
            title: DotNetEmitterSingleFile shall render parameter type cells as plain
              text rather than Markdown links.
            justification: |
              Relative file links are meaningless inside a single document; plain-text type
              names keep the output valid in any Markdown renderer without broken link
              references.
            tests:
              - DotNetEmitterSingleFile_Emit_MethodWithParameter_TypeCellIsPlainText
          - id: ApiMarkDotNet-DotNetEmitterSingleFile-NeverLinkCrefReferences
            title: DotNetEmitterSingleFile shall render every `<see cref>`/`<seealso
              cref>` reference as code-span-only text, never as a Markdown link,
              regardless of whether the cref's target would otherwise be resolvable
              and emitted.
            justification: |
              Relative Markdown links are meaningless inside a single document, the
              same reason parameter type cells are already rendered as plain text
              rather than links (see EmitPlainTextParameterTypes above). Full `<see
              cref>`/`<seealso cref>` cross-reference linking is explicitly out of
              scope for single-file mode. This is satisfied by the invariant that no
              XmlDocReader call site in this class ever constructs or passes a
              non-null CrefLinkContext — directly, or indirectly via
              NamespaceDescription's GetSummary/GetRemarks/GetExampleParts
              accessors — so the optional CrefLinkContext parameter always defaults
              to or is passed as null; this is simpler and safer than adding an
              explicit opt-out branch.
            tests:
              - CrefLinking_SingleFileMode_SeeCrefToVisibleType_RemainsCodeSpanOnly
              - CrefLinking_SingleFileMode_NamespaceDocRemarksSeeCref_RemainsCodeSpanOnly

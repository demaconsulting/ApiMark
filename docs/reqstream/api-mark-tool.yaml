---
# ApiMarkTool system-level requirements
sections:
  - title: ApiMarkTool Requirements
    requirements:
      - id: ApiMarkTool-ProvideMultiLanguageCli
        title: ApiMarkTool shall provide a .NET executable that supports multiple documentation language subcommands.
        tags: [system]
        justification: |
          A command-line executable gives ApiMarkTask and developers an automation-friendly
          way to run ApiMark for any supported language. Targeting net10.0 and later as a standalone
          process allows use of language libraries that do not support netstandard2.0.
        children:
          - ApiMarkTool-Program-AcceptLanguageArgument
          - ApiMarkTool-Program-DispatchToGenerator
          - ApiMarkTool-Program-SupportDotNetOptions
          - ApiMarkTool-Program-EnforceDocumentationCoverage
          - ApiMarkTool-Program-SupportCppOptions
          - ApiMarkTool-Program-SupportVhdlOptions
          - ApiMarkTool-Program-SupportVersionOption
          - ApiMarkTool-Program-SupportHelpOption
          - ApiMarkTool-Program-SupportSilentAndLogOptions
          - ApiMarkTool-Program-SupportValidateOption
          - ApiMarkTool-Program-ReportInvalidArguments
          - ApiMarkTool-Program-DotNetDefaultVisibility
          - ApiMarkTool-Program-OtherLanguagesDefaultVisibility
          - ApiMarkTool-Program-ExternalLinkMapping
          - ApiMarkTool-Program-ExternalLinkInvalid
          - ApiMarkTool-Cli-ProvideCliArgumentParsing
          - ApiMarkTool-SelfTest-RunSelfValidation
        tests:
          - Program_Main_DotNetCommand_GeneratesExpectedOutput
          - ApiMark_DotNetGeneration
          - ApiMark_VhdlGeneration
          - ApiMark_CppGeneration
      - id: ApiMarkTool-ProvideHelpTopics
        title: ApiMarkTool shall list its help topics when run with the help command.
        tags: [system]
        justification: |
          Users and AI agents that have only the installed tool must be able to learn how to
          use it from the tool itself. The short --help usage text points to the topic list,
          and each topic explains a task with worked examples.
        children:
          - ApiMarkTool-Program-AnswerHelpCommand
          - ApiMarkTool-Program-HelpFooter
          - ApiMarkTool-Cli-AnswerHelpTopics
        tests:
          - ApiMarkTool_HelpTopics_HelpVerb_ListsTopics
      - id: ApiMarkTool-RejectUnknownHelpTopic
        title: ApiMarkTool shall exit with code 2 when the help command names an unknown topic.
        tags: [system]
        justification: |
          Scripts and AI agents must be able to tell a mistyped topic from a successful answer,
          and from the exit code 1 of a failed tool run.
        children:
          - ApiMarkTool-Program-AnswerHelpCommand
        tests:
          - ApiMarkTool_HelpTopics_UnknownTopic_ReturnsUsageError
      - id: ApiMarkTool-ProvideWorkingHelpExamples
        title: ApiMarkTool shall provide help examples that give the result each example states when run.
        tags: [system]
        justification: |
          A worked example in the help is only useful when it works. Running every command
          example against the built tool, and comparing the exit code and output with what the
          example states, keeps the help in step with the tool.
        children:
          - HelpCards-Testing-ReportCardDefects
        tests:
          - ApiMarkTool_HelpExamples_AllCommandExamples_GiveStatedResults

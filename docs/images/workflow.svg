<svg xmlns="http://www.w3.org/2000/svg" width="920" height="352" viewBox="0 0 920 352" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="896" height="330" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="896" height="330" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(35,34)">
    <!-- Step 1: document -->
    <rect x="0" y="0" width="190" height="260" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="95" y="30" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Document your code</text>
    <rect x="14" y="46" width="162" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="95" y="70" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">C# / .NET</text>
    <text x="95" y="90" font-size="12" fill="#1e40af" text-anchor="middle">XML doc comments</text>
    <rect x="14" y="114" width="162" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="95" y="138" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">C++</text>
    <text x="95" y="158" font-size="12" fill="#1e40af" text-anchor="middle">Doxygen comments</text>
    <rect x="14" y="182" width="162" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="95" y="206" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">VHDL</text>
    <text x="95" y="226" font-size="12" fill="#1e40af" text-anchor="middle">--! doc comments</text>

    <line x1="194" y1="130" x2="216" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 2: run -->
    <rect x="220" y="0" width="190" height="260" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="315" y="30" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">2. Run ApiMark</text>
    <rect x="234" y="46" width="162" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="315" y="70" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">MSBuild package</text>
    <text x="315" y="90" font-size="12" fill="#92400e" text-anchor="middle">runs on every build</text>
    <rect x="234" y="114" width="162" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="315" y="138" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">apimark CLI</text>
    <text x="315" y="158" font-size="12" fill="#92400e" text-anchor="middle">dotnet, cpp or vhdl</text>
    <rect x="234" y="182" width="162" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="315" y="206" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--enforce-docs</text>
    <text x="315" y="226" font-size="12" fill="#92400e" text-anchor="middle">optional coverage gate</text>

    <line x1="414" y1="130" x2="436" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 3: Markdown -->
    <rect x="440" y="0" width="190" height="260" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="535" y="30" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">3. Get Markdown</text>
    <rect x="454" y="46" width="162" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="535" y="70" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#4c1d95" text-anchor="middle">api.md</text>
    <text x="535" y="90" font-size="12" fill="#5b21b6" text-anchor="middle">root index</text>
    <rect x="454" y="114" width="162" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="535" y="138" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Namespace, type</text>
    <text x="535" y="158" font-size="12" fill="#5b21b6" text-anchor="middle">and member pages</text>
    <rect x="454" y="182" width="162" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="535" y="206" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Single file</text>
    <text x="535" y="226" font-size="12" fill="#5b21b6" text-anchor="middle">one api.md instead</text>

    <line x1="634" y1="130" x2="656" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 4: use -->
    <rect x="660" y="0" width="190" height="260" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="755" y="30" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">4. Use it</text>
    <rect x="674" y="46" width="162" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="755" y="70" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">AI agent</text>
    <text x="755" y="90" font-size="12" fill="#166534" text-anchor="middle">index first, then drill in</text>
    <rect x="674" y="114" width="162" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="755" y="138" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Your repository</text>
    <text x="755" y="158" font-size="12" fill="#166534" text-anchor="middle">commit the output folder</text>
    <rect x="674" y="182" width="162" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="755" y="206" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Your NuGet package</text>
    <text x="755" y="226" font-size="12" fill="#166534" text-anchor="middle">ApiMarkPackDocs=true</text>

    <text x="425" y="290" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Read only as deep as the task requires.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. .NET assemblies with their XML documentation, C++ headers, VHDL sources, and MSBuild
       projects flow into the apimark tool and come out as Markdown API reference pages, a documentation-coverage
       gate, a PDF made from the Markdown by Pandoc, and published docs.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
      <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .link { fill: #4f46e5; }
      .code { font: bold 22px monospace; fill: #e2e8f0; }
      .comment { fill: #4ade80; }
      .keyword { fill: #c4b5fd; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176">Api</text>
  <text class="word brandText" x="200.2" y="176">Mark</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Markdown API reference</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">from .NET, C++ and VHDL.</text>
  <text class="body" x="58" y="368">Writes an index, namespace and type</text>
  <text class="body" x="58" y="402">pages or one api.md, and can enforce</text>
  <text class="body" x="58" y="436">doc coverage. CLI tool or MSBuild.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">apimark vhdl --source</text>
  <text class="cmd file" x="138" y="539">rtl/*.vhd</text>
  <text class="cmd" x="288" y="539">--output</text>
  <text class="cmd file" x="423" y="539">api</text>
  <text class="note" x="58" y="604">.NET 10 and 11 &#183; Windows, Linux, macOS</text>

  <!-- Input cards -->
  <g>
    <!-- .NET assemblies: a compiled assembly and its XML documentation file -->
    <rect class="card" x="580" y="40" width="236" height="160" rx="16"/>
    <rect x="642" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="220" height="112" rx="10"/>
    <rect x="602" y="60" width="38" height="38" rx="8" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
    <g fill="#fbbf24">
      <rect x="610" y="69" width="6" height="6" rx="1"/>
      <rect x="618" y="69" width="6" height="6" rx="1" fill-opacity="0.45"/>
      <rect x="626" y="69" width="6" height="6" rx="1"/>
      <rect x="610" y="77" width="6" height="6" rx="1" fill-opacity="0.45"/>
      <rect x="618" y="77" width="6" height="6" rx="1"/>
      <rect x="626" y="77" width="6" height="6" rx="1" fill-opacity="0.45"/>
      <rect x="610" y="85" width="6" height="6" rx="1"/>
      <rect x="618" y="85" width="6" height="6" rx="1" fill-opacity="0.45"/>
      <rect x="626" y="85" width="6" height="6" rx="1"/>
    </g>
    <text class="miniMono" x="652" y="87" fill="#fde68a">MyLib.dll</text>
    <rect x="602" y="110" width="38" height="38" rx="8" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M613 121 L606 129 L613 137 M629 121 L636 129 L629 137 M624 119 L618 139" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="miniMono" x="652" y="137" fill="#bbf7d0">MyLib.xml</text>
    <text class="label" x="698" y="190">.NET assemblies</text>

    <!-- C++ headers: a Doxygen-commented struct -->
    <rect class="card" x="828" y="40" width="216" height="160" rx="16"/>
    <rect x="880" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="836" y="48" width="200" height="112" rx="10"/>
    <text class="code comment" x="848" y="80">/// A point</text>
    <text class="code" x="848" y="112"><tspan class="keyword">struct</tspan> Point</text>
    <text class="code" x="848" y="144">{ int x; };</text>
    <text class="label" x="936" y="190">C++ headers</text>

    <!-- VHDL sources: a documented entity -->
    <rect class="card" x="1056" y="40" width="216" height="160" rx="16"/>
    <rect x="1108" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1064" y="48" width="200" height="112" rx="10"/>
    <text class="code comment" x="1076" y="80">--! Counter</text>
    <text class="code" x="1076" y="112"><tspan class="keyword">entity</tspan> cnt</text>
    <text class="code" x="1076" y="144"><tspan class="keyword">port</tspan> (clk);</text>
    <text class="label" x="1164" y="190">VHDL sources</text>

    <!-- MSBuild projects: documented as part of the build -->
    <rect class="card" x="1284" y="40" width="276" height="160" rx="16"/>
    <rect x="1366" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1292" y="48" width="260" height="112" rx="10"/>
    <text class="code" x="1306" y="86"><tspan fill="#5eead4">&gt;</tspan> dotnet build</text>
    <circle cx="1530" cy="79" r="11" fill="#22c55e"/>
    <path d="M1524.5 79 L1528.5 83 L1535.5 75" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1298" y="108" width="116" height="36" rx="8" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-width="1.5"/>
    <text class="miniMono" x="1356" y="133" fill="#bfdbfe" text-anchor="middle">.csproj</text>
    <rect x="1420" y="108" width="126" height="36" rx="8" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-width="1.5"/>
    <text class="miniMono" x="1483" y="133" fill="#bfdbfe" text-anchor="middle">.vcxproj</text>
    <text class="label" x="1422" y="190">MSBuild projects</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M698,206 C698,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M936,206 C936,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1164,206 C1164,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1422,206 C1422,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="698" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="936" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1164" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1422" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine -->
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="884" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M893 282 L906 282 L912 288 L912 306 L893 306 Z" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="897" y="290" width="11" height="2.5" rx="1.2"/>
    <rect x="897" y="295" width="11" height="2.5" rx="1.2"/>
    <rect x="897" y="300" width="7" height="2.5" rx="1.2"/>
  </g>
  <text class="engine" x="936" y="305">apimark</text>
  <line x1="1120" y1="278" x2="1120" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1140" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- A Markdown type page with its member table and cross-links -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <path class="page" d="M604 406 L834 406 L852 424 L852 542 L604 542 Z"/>
    <path d="M834 406 L834 424 L852 424 Z" fill="#cbd5e1"/>
    <text class="mini" x="618" y="436" fill="#7c3aed">#</text>
    <text class="mini ink" x="640" y="436">Thermostat</text>
    <line x1="618" y1="452" x2="836" y2="452" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="mini link" x="618" y="482">Read()</text>
    <rect class="link" x="618" y="486" width="68" height="2"/>
    <rect class="bar" x="740" y="472" width="90" height="6" rx="3"/>
    <line x1="618" y1="498" x2="836" y2="498" stroke="#e2e8f0" stroke-width="1.5"/>
    <text class="mini link" x="618" y="528">SetTarget()</text>
    <rect class="link" x="618" y="532" width="116" height="2"/>
    <rect class="bar" x="760" y="518" width="70" height="6" rx="3"/>
    <text class="label" x="728" y="585">Markdown API pages</text>

    <!-- The documentation-coverage gate: documented items pass, a missing doc comment fails -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <circle cx="923" cy="424" r="11" fill="#22c55e"/>
    <path d="M917.5 424 L921.5 428 L928.5 420" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="bar" x="944" y="420" width="132" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="923" cy="456" r="11" fill="#22c55e"/>
    <path d="M917.5 456 L921.5 460 L928.5 452" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="bar" x="944" y="452" width="110" height="8" rx="4" fill-opacity="0.75"/>
    <circle cx="923" cy="488" r="11" fill="#ef4444"/>
    <path d="M918.5 483.5 L927.5 492.5 M927.5 483.5 L918.5 492.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="944" y="484" width="120" height="8" rx="4" fill="#fca5a5" fill-opacity="0.85"/>
    <rect x="934" y="508" width="130" height="32" rx="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
    <text class="mini" x="999" y="531" fill="#fecaca" text-anchor="middle">1 missing</text>
    <text class="label" x="999" y="585">Coverage gate</text>

    <!-- A PDF made downstream by Pandoc from the Markdown -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <path class="page" d="M1185 408 L1267 408 L1283 424 L1283 542 L1185 542 Z"/>
    <path d="M1267 408 L1267 424 L1283 424 Z" fill="#cbd5e1"/>
    <rect x="1197" y="420" width="50" height="8" rx="4" fill="#4f46e5"/>
    <rect class="bar" x="1197" y="436" width="72" height="5" rx="2.5"/>
    <rect class="bar" x="1197" y="446" width="60" height="5" rx="2.5"/>
    <rect class="bar" x="1197" y="456" width="68" height="5" rx="2.5"/>
    <rect class="bar" x="1197" y="466" width="50" height="5" rx="2.5"/>
    <rect x="1161" y="486" width="64" height="34" rx="6" fill="#ef4444" filter="url(#paper)"/>
    <text class="mini" x="1193" y="511" fill="#ffffff" text-anchor="middle">PDF</text>
    <rect class="bar" x="1237" y="500" width="34" height="5" rx="2.5"/>
    <rect class="bar" x="1197" y="528" width="64" height="5" rx="2.5"/>
    <text class="label" x="1232" y="585">PDF via Pandoc</text>

    <!-- Published docs: in the repository, in the NuGet package, and read by AI agents -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <line x1="1397" y1="448" x2="1517" y2="448" stroke="#64748b" stroke-width="3"/>
    <circle cx="1397" cy="448" r="17" fill="#4f46e5"/>
    <path d="M1387 440 L1394 440 L1397 443 L1407 443 L1407 456 L1387 456 Z" fill="#ffffff"/>
    <circle cx="1457" cy="448" r="17" fill="#2563eb"/>
    <path d="M1457 437 L1467 442.5 L1467 453.5 L1457 459 L1447 453.5 L1447 442.5 Z" fill="#ffffff"/>
    <path d="M1447 442.5 L1457 448 L1467 442.5 M1457 448 L1457 459" fill="none" stroke="#2563eb" stroke-width="2"/>
    <circle cx="1517" cy="448" r="17" fill="url(#brand)"/>
    <path d="M1517 436 Q1519 446 1529 448 Q1519 450 1517 460 Q1515 450 1505 448 Q1515 446 1517 436 Z" fill="#ffffff"/>
    <rect x="1385" y="494" width="144" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">docs/api</text>
    <text class="label" x="1457" y="585">Published docs</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; solid-color shadows because PDF/A output drops opacity -->
  <rect x="26" y="29" width="300" height="64" rx="32" fill="#94a3b8"/>
  <rect x="20" y="22" width="300" height="64" rx="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="61" font-size="17" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">api.md</text>

  <rect x="26" y="119" width="300" height="64" rx="32" fill="#94a3b8"/>
  <rect x="20" y="112" width="300" height="64" rx="32" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="151" font-size="17" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">{namespace}.md</text>

  <rect x="26" y="209" width="300" height="64" rx="32" fill="#94a3b8"/>
  <rect x="20" y="202" width="300" height="64" rx="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="170" y="241" font-size="17" font-family="Consolas, monospace" fill="#4c1d95" text-anchor="middle">{namespace}/{type}.md</text>

  <rect x="26" y="299" width="300" height="64" rx="32" fill="#94a3b8"/>
  <rect x="20" y="292" width="300" height="64" rx="32" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="170" y="331" font-size="17" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">…/{type}/{member}.md</text>

  <line x1="170" y1="90" x2="170" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="170" y1="180" x2="170" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="170" y1="270" x2="170" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="16" font-weight="600" fill="#334155">
    <text x="360" y="50">Root index</text>
    <text x="360" y="140">Namespace summary</text>
    <text x="360" y="230">Type page</text>
    <text x="360" y="320">Member detail</text>
  </g>
  <g font-size="13" fill="#475569">
    <text x="360" y="70">Namespaces with type counts and summaries</text>
    <text x="360" y="160">Types, enums and functions, one line each</text>
    <text x="360" y="250">Members grouped by kind, with signatures</text>
    <text x="360" y="340">Parameters, returns, remarks and examples</text>
  </g>
  <text x="20" y="388" font-size="13" font-style="italic" fill="#475569">Read only as deep as the task requires.</text>
</svg>

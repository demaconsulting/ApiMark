---
# CodeQL configuration for ApiMark
# Suppresses intentional generic catch clauses
name: ApiMark CodeQL Config
# Globally ignore build output and generated files
paths-ignore:
  - '**/obj/**'
  - '**/bin/**'
# Query filters to disable specific queries for certain paths
query-filters:
  # Suppress warnings in generated build output under obj/ (for example the source-generated
  # regex implementations), which cannot be modified.
  - exclude:
      id: cs/useless-assignment-to-local
    paths: ['**/obj/**/*.cs']
  - exclude:
      id: cs/missed-ternary-operator
    paths: ['**/obj/**/*.cs']
  - exclude:
      id: cs/useless-cast-to-self
    paths: ['**/obj/**/*.cs']
  - exclude:
      id: cs/unused-label
    paths: ['**/obj/**/*.cs']
  - exclude:
      id: cs/catch-of-all-exceptions
    paths: [src/ApiMark.Tool/Cli/Context.cs, src/ApiMark.Tool/Program.cs]
  # Suppress warnings in ANTLR4-generated lexer/parser files — these are generated
  # code that cannot be modified and do not reflect hand-authored design decisions.
  - exclude:
      id: cs/virtual-call-in-constructor
    paths: ['**/VhdlAst/Antlr/**']
  - exclude:
      id: cs/missed-readonly-modifier
    paths: ['**/VhdlAst/Antlr/**']
  # Test fixtures deliberately model C# API shapes (explicit IEquatable without Equals(object),
  # `new` field hiding) so the emitters can be tested against them.
  - exclude:
      id: cs/class-missing-equals
    paths: ['test/ApiMark.DotNet.Fixtures*/**']
  - exclude:
      id: cs/field-masks-base-field
    paths: ['test/ApiMark.DotNet.Fixtures*/**']

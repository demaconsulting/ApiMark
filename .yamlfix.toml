# YAML Auto-Fix Configuration
#
# NOTES:
# - comments_min_spaces_from_content is 1 (not yamllint's 2) on purpose: any value above 1
#   enables a yamlfix text pass that also rewrites spacing before any '#' inside full-line
#   comments (for example "(not #)" or a commented-out "#   # note"), so fix.ps1 changed
#   comment text in .lintmark.yaml and .textlint.yaml on every run. With 1, yamlfix leaves
#   comment spacing alone and yamllint's comments rule still enforces 2 spaces before inline comments
line_length = 10000
preserve_quotes = true
sequence_style = "keep_style"
whitelines = 1
comments_min_spaces_from_content = 1
